# cargo-nextest, as CI runs the tests (.github/workflows/ci.yml: `cargo nextest run --profile ci`).
# Each test runs in a process of its own, and the tests of every binary run side by side: what was
# one binary after another (`cargo test`) takes a fraction of the time on the same runner. Tests
# that take turns over the process's own state (a static Mutex) are apart anyway.
# Doc tests aren't nextest's: CI runs them with `cargo test --doc`.

[profile.ci]
# Every failing test in one run, not just the first.
fail-fast = false
# A test that fails fails: no retries that would hide a flaky one.
retries = 0
# A test still running after 2 minutes is named as slow; one still going after 10 is stopped, so a
# hung test fails its job with its name rather than running into the job's timeout.
slow-timeout = { period = "120s", terminate-after = 5 }
failure-output = "immediate-final"
status-level = "slow"
final-status-level = "slow"
