[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.6"
edition = "2024"
license = "Apache-2.0"
authors = ["Tobias"]
repository = "https://github.com/dokyit/Trek"

[workspace.dependencies]
trek-core = { path = "crates/trek-core" }
trek-agents = { path = "crates/trek-agents" }
trek-ipc = { path = "crates/trek-ipc" }
gpui-kit = { version = "=0.7.0", features = ["tree-sitter", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-markdown", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
futures = "0.3"
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
semver = { version = "1", features = ["serde"] }
walkdir = "2"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Trek carries a small patch to gpui-base: semibold (not bold) emphasis, calmer heading sizes,
# and a few opt-in style knobs for rendered markdown (bold colour, a measure for running text,
# list spacing and marker colour), and coloured text and highlights from inline `<span style="color: …">`
# and `<mark>` (for notes). See "Trek:" in vendor/gpui-base/src/text/{node,style}.rs and format/markdown.rs.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
