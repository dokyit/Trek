[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.12"
edition = "2024"
license = "Apache-2.0"
authors = ["Tobias"]
repository = "https://github.com/dokyit/Trek"

[workspace.dependencies]
trek-core = { path = "crates/trek-core" }
trek-agents = { path = "crates/trek-agents" }
trek-ipc = { path = "crates/trek-ipc" }
trek-test-fixtures = { path = "crates/test-fixtures" }
gpui-kit = { version = "=0.7.0", features = ["tree-sitter", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-markdown", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-csharp", "tree-sitter-sql", "tree-sitter-php", "tree-sitter-make", "tree-sitter-cmake", "tree-sitter-markdown-inline", "tree-sitter-zig", "tree-sitter-scala", "tree-sitter-elixir", "tree-sitter-svelte", "tree-sitter-astro", "tree-sitter-jsdoc"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
futures = "0.3"
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
semver = { version = "1", features = ["serde"] }
walkdir = "2"

[profile.dev]
opt-level = 1
# Line tables, not full variable info: panics and breakpoints stay symbolicated, and crates this
# size compile and link measurably sooner than with full DWARF (the 11-minute CI compile and
# every local `cargo build`). Flip back if you're stepping locals in a debugger.
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Thin LTO with 16 codegen units: the trek-app crate alone took 365 s with one unit and takes
# about 185 s with 16 (measured 2026-10-20), for a binary about a tenth bigger. One unit is not
# worth the wait for a GUI app.
lto = "thin"
codegen-units = 16
strip = true

# Local app bundles skip thin LTO: the link alone ran about a minute of script/bundle.sh,
# and a build you'll install from source doesn't need link-time optimisation. Releases keep
# the real thing — script/release.sh sets TREK_RELEASE_BUILD=1 and bundle.sh uses --release.
[profile.bundle]
inherits = "release"
lto = false

# Trek carries a small patch to gpui-base: semibold (not bold) emphasis, calmer heading sizes,
# and a few opt-in style knobs for rendered markdown (bold colour, a measure for running text,
# list spacing and marker colour), and coloured text and highlights from inline `<span style="color: …">`
# and `<mark>` (for notes). See "Trek:" in vendor/gpui-base/src/text/{node,style}.rs and format/markdown.rs.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
# And to gpui-pre-macos: an app that set the Accessory activation policy before launching keeps
# it, so capture and test runs (TREK_SHOT_DIR, TREK_BACKGROUND) never put a Trek tile in the
# Dock. See "Trek:" in vendor/gpui-pre-macos/src/platform.rs.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# And to gpui-pre: a visible tooltip checks the mouse against its element's hitbox in the frame
# being drawn, not the bounds it had when it appeared, so one whose element moved out from under a
# still mouse (a scroll, an answer streaming in, a row's hover-only buttons going away) goes away
# instead of staying until the mouse moves. See "Trek:" in vendor/gpui-pre/src/{window.rs,
# elements/div.rs}.
gpui-pre = { path = "vendor/gpui-pre" }
