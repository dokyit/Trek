area = "App"
what = "Agents keep working with Trek's window closed"
macos = "yes"
windows = "yes"
live = ["route project:{project}", "pace 1", "send mock:long 10s", "wait 1500", "keep-working", "wait 2500", "show-main", "wait 1500", "count working-bar 1", "click stop", "pace 0"]
live_windows = ["route project:{project}", "pace 1", "send mock:long 10s", "wait 1500", "keep-working", "wait 2500", "show-main", "wait 1500", "count working-bar 1", "click stop", "pace 0", "route settings:notifications", "wait 300", "reveal menu-bar-icon", "click menu-bar-icon", "route settings:general", "wait 300", "reveal stay-in-tray", "click stay-in-tray", "close-main", "wait 1500", "count-all title-text 0", "tray on", "show-main", "wait 1500", "count title-text 1", "route settings:general", "wait 300", "reveal stay-in-tray", "click stay-in-tray", "route settings:notifications", "wait 300", "reveal menu-bar-icon", "click menu-bar-icon"]
