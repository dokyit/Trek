# ---------- Tools ----------

[[feature]]
id = "iphone-tool"
area = "Tools"
what = "The iPhone tool: your real iPhone for you and agents"
macos = "yes"
windows = "yes"
linux = "no"
live_macos = ["phone touch", "wait 800", "count phone-mirror 1"]
live_windows = ["phone ready", "wait 600", "count phone-apps 1", "count phone-install 1", "phone files", "wait 600", "count phone-files 1", "phone screen", "wait 600", "click phone-tab#2", "wait 1500", "count phone-screen 1", "count phone-home 1", "count phone-type 1", "click phone-screen", "wait 800", "phone tapped 1", "phone disk-image", "wait 600", "click phone-tab#2", "wait 800", "count phone-screen-choose 1"]
how = { macos = "Live screen and system audio over USB: the display service's HEVC and negotiated AAC-ELD streams off the CoreDevice tunnel, decoded by VideoToolbox and AudioToolbox once the developer disk image is mounted (the cable's ~1 fps screenshots stay the picture fallback), with keyboard and mouse over Bluetooth, iPhone Mirroring or Trek Driver for taps, apps and files.", windows = "Through Apple Devices (Apple Mobile Device Service, from the Microsoft Store): the phone's details, its screen (CoreDevice's screenshot service; a click a tap and a drag a swipe, typing, keys and Home through the HID back channel while the display service's stream runs; apps opened by name through its app service; once its developer disk image is installed from Xcode's iOS_DDI folder, as a cryptex on newer iOS), its apps (list, install an .ipa) and files (media, and apps' Documents: add, save, remove), AssistiveTouch, and agents' phone tools for them (phone_screenshot and phone_tap included), one agent at a time, with installs and file changes asked first. The panel says what's missing: Apple Devices, its service, a phone, Trust, unlocking, the disk image. Live system-audio playback is macOS-only because it uses AudioToolbox." }
note = "The screen and taps on a PC come from CoreDevice's own services, the ones Xcode's Device Hub uses (trek_phone::coredevice: a screenshot service, the display service's media stream, and the HID back channel), over the phone's tunnel, with no Trek Driver to build or sign: the iPhone tool's Screen tab (a still about every second, a click a tap) and agents' phone_screenshot, phone_elements, phone_tap, phone_wait, phone_swipe, phone_type, phone_key, phone_home and phone_open_app. They need the phone's developer disk image, which the tool installs from Xcode's iOS_DDI folder copied from a Mac: newer iOS takes it as a cryptex (cryptexd), older through the image mounter (the image its manifest names for the phone). The tool notes the folder and installs the image from it again when the phone comes back without it (a restart takes it off), as Xcode does. Run from Windows on an iPhone 16 Pro Max with iOS 27.2: the image Xcode had put there was found, taken off and installed again from the folder (signed for the phone by Apple, in about 4 seconds), the screen showed in the Screen tab at 1320×2868, and taps landed: one opened a folder on the home screen and the next closed it. That run found three things a made-up phone couldn't. iOS 27 refuses the image mounter's image. Every picture stayed in memory (15 MB each, one a second); each is now decoded off the UI thread into a copy no bigger than it's drawn, and let go of when the next comes. And a tap did nothing, with no error: the stream that lets touches in was stopped as soon as the tap was sent, before its lift landed, so it now stays 0.7 s after. On the same phone a swipe paged the Home Screen and back, 12+30= typed into Calculator gave 42 (Shift held for +), and Home left an app and closed a folder. Opening an app by name hung, as iOS 27 lists apps only as a stream; it now streams the list (233 apps, Apple's included), and Calculator opened by name. The screen is read as elements through the phone's accessibility daemon (axauditd's remoteAXService, as Xcode 27's Device Hub reads it: trek_phone::ax), in the shape Trek Driver lists them on a Mac, so trek-mcp's outline, refs, tap by ref and phone_wait are the same: on the same phone the frames lined up with the screenshot, with nothing shown on the phone while it read. The difference left is the Mac's live picture (Trek Driver's stream) against a PC's still about every second. On a Mac the Screen tab's picture is now the display service's own live stream too (trek_phone::coredevice::live: the HEVC/RTP the phone sends to the tunnel's UDP socket, depacketized by idevice's HevcDepacketizer, access units cut at its AUD markers, decoded by a VideoToolbox session to BGRA, with the RTCP receiver reports Apple's encoder expects), the same media session touches already rode; it starts once the developer disk image is mounted (mounted from Xcode's iOS_DDI folder when it isn't) and the cable's screenshots stay the picture until the first frame and whenever it can't start. The decode is VideoToolbox's, so Windows keeps the ~1 fps stills for now. Linux: no iPhone tool or tab: no Apple Mobile Device Service to reach the phone through (usbmuxd from libimobiledevice would be the way)."
code = ["crates/trek-phone/src/lib.rs", "crates/trek-phone/src/pc.rs", "crates/trek-app/src/panels/mod.rs", "crates/trek-app/src/panels/phone/windows.rs", "crates/trek-mcp/src/phone.rs", "crates/trek-phone/src/driver.rs", "crates/trek-phone/src/device.rs", "crates/trek-app/src/panels/phone.rs", "crates/trek-app/src/workspace/phone_use.rs", "crates/trek-app/src/settings_view.rs", "crates/trek-phone/src/coredevice/live.rs", "crates/trek-phone/src/coredevice/live/audio.rs"]
tests = ["crates/trek-app/tests/iphone.rs", "crates/trek-phone/src/pc.rs", "crates/trek-phone/examples/driver_bench.rs", "crates/trek-phone/examples/driver_run.rs", "crates/trek-phone/examples/driver_get.rs", "crates/trek-phone/examples/mirror.rs", "crates/trek-phone/examples/devices.rs", "crates/trek-phone/examples/pc_screen.rs", "crates/trek-phone/examples/live.rs", "crates/trek-phone/src/coredevice.rs", "crates/trek-phone/src/coredevice/live.rs", "crates/trek-phone/src/coredevice/live/audio.rs"]

