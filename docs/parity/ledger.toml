untested = { macos = "The Metal layer keeps a third drawable only while frames come close together, and a second after the last frame its spare drawables are let go of (vendor/gpui-pre-apple/src/drawables.rs). Measured with footprint on the isolated app, 1600 x 1000: 97 MB at rest and 122 MB after a stream, against 135 and 171 before; no test reads a layer's drawables.", windows = "Not on Windows: the DirectX swap chain's buffers (three, vendor/gpui-pre-windows/src/directx_renderer.rs) change only through ResizeBuffers, which needs every reference to them released and redraws the window; not tried.", linux = "Not on Linux: the wgpu surface (gpui-pre-wgpu, from crates.io) keeps the swap chain's images its present mode asks for, and Trek doesn't carry a patch to that crate; not tried." }
