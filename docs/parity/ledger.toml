# What every user-facing feature does on each platform. Checked by `cargo test -p trek-parity` on
# every platform's CI (see docs/CROSS_PLATFORM.md); docs/PARITY.md is generated from it.
#
#   macos / windows / linux
#                    "yes": works as on the others (`how` says where it's done another way; its
#                    `linux` only where Linux differs from both);
#                    "partial": works with less;  "no": isn't there;  "n/a": means nothing there.
#   note             required for "partial" and "no": what's missing, why, and what would bring it.
#   code / tests     where the platform split is, and what covers it (files that exist).
#
# A change that adds or removes a platform gate (`cfg(windows)`, `cfg!(target_os = "macos")`)
# updates the feature it belongs to here, then records the counts:
#   TREK_PARITY_UPDATE=1 cargo test -p trek-parity

# ---------- The app ----------

[[feature]]
id = "keep-working-window-closed"
area = "App"
what = "Agents keep working with Trek's window closed"
macos = "yes"
windows = "yes"
linux = "yes"
live = ["route project:{project}", "pace 1", "send mock:long 10s", "wait 1500", "keep-working", "wait 2500", "show-main", "wait 1500", "count working-bar 1", "click stop", "pace 0"]
how = { macos = "The app stays up in the Dock; the Dock icon reopens the window.", windows = "Closing the window with agents at work asks: Keep Working closes Trek's windows and quits once the work is done (after a grace for its banners), and opening Trek or the tray icon brings the window back. With nothing at work, closing quits.", linux = "As on Windows (no Dock): closing the window quits once nothing is at work, unless Settings › General keeps Trek in the tray, which needs a tray on the desktop (KDE, Ubuntu's GNOME, Xfce; other GNOMEs need the AppIndicator extension); without one it closes as with the setting off." }
note = "Windows has no Dock, so Trek would end with its window. Settings › General › Keep Trek in the tray when its window closes, on unless turned off, matches the Mac (the first time, a banner says Trek is in the tray, as Windows tucks a new icon away behind its ^ arrow): the windows close and Trek stays up in the tray, nothing asked even with agents at work, until the tray's Quit; it needs the tray icon to come back through, so with no icon on the taskbar (not made, or not taken) the window closes as with the setting off, and a Trek in the tray whose icon the taskbar loses for 20 seconds (Explorer restarting adds it again) brings its window back. A launch while Trek quits waits for it to go and opens a new one. Its live check is in status-icon's steps on Windows, while that icon is up: the icon is made once per run, as Windows Server's taskbar hides one that comes back."
code = ["crates/trek-app/src/root.rs", "crates/trek-app/src/lib.rs"]
tests = ["crates/trek-app/tests/titlebar.rs", "crates/trek-app/tests/windows.rs"]

