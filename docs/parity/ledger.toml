what = "Agent CLIs kept up to date, the way each was installed"
macos = "yes"
windows = "yes"
how = { macos = "npm, Bun, pnpm, Volta, Homebrew, and vendors' own updaters.", windows = "npm, Volta, WinGet, Scoop, Chocolatey (one administrator prompt for all), PowerShell installers and vendors' own updaters. A CLI that replaces its own files (Copilot) updates itself even when WinGet installed it; the version probes end with what they started; an update waits for the agent's running copies to end." }
code = ["crates/trek-core/src/agent_update.rs", "crates/trek-core/src/detect.rs"]
tests = ["crates/trek-core/src/agent_update.rs", "crates/trek-core/src/detect.rs", "crates/trek-app/tests/agent_updates.rs"]

[[feature]]
id = "model-names"
