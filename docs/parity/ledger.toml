what = "An opened timeline row stays in view while following the end; the context bar's slivers stay within it; Compact now stays until the summary is done"
macos = "yes"
windows = "yes"
how = { macos = "The same on both.", windows = "The same on both: made for Windows first, behind its styling switch (fluent::WINDOWS), so the Mac had none of them until this audit." }
code = ["crates/trek-app/src/thread_view.rs", "crates/trek-app/src/context_popover.rs"]

[[feature]]
id = "timeline-thoughts"
area = "Threads"
what = "The thought streaming in after a group of tool calls, in the timeline and the working bar"
macos = "partial"
windows = "yes"
note = "Shown by Windows' timeline design only (fluent::WINDOWS). Whether the Mac's timeline shows it too is a design decision, not a bug: kept apart until it's made."
code = ["crates/trek-app/src/thread_view.rs", "crates/trek-app/src/working_bar.rs"]

[[feature]]
id = "cloud-file-preview"
area = "Editor"
what = "The preview opens files that live only in the cloud"
macos = "n/a"
windows = "yes"
how = { macos = "iCloud Drive's files open as any others.", windows = "OneDrive's online-only files are fetched first, and the button names the default app." }
code = ["crates/trek-app/src/ide/preview.rs"]

[[feature]]
id = "alerts-and-push"
area = "Notifications"
what = "An alert sound, a push to the phone (ntfy), and knowing when you're away"
macos = "yes"
windows = "yes"
how = { macos = "macOS's idle time and screen lock.", windows = "Windows' idle time and session lock." }
code = ["crates/trek-app/src/push.rs"]

[[feature]]
id = "agent-tool-families"
area = "Agent tools"
what = "Agents' Simulator, iPhone and Trek-update tools"
macos = "yes"
windows = "partial"
note = "On Windows agents get the iPhone's apps and files tools (iphone-tool). The Simulator's need Xcode, and Trek's update helper for agents is the Mac's own."
code = ["crates/trek-mcp/src/main.rs"]

[[feature]]
id = "credentials-and-node"
area = "Agents"
what = "API keys kept in the system's credential store, and Node.js for npm-only agents"
macos = "yes"
windows = "yes"
how = { macos = "The Keychain; Node from Homebrew or Trek's own.", windows = "Credential Manager; Trek's own Node." }
code = ["crates/trek-core/src/keychain.rs", "crates/trek-app/src/workspace/node_setup.rs"]

[[feature]]
id = "devices-sidebar"
area = "iPhone"
what = "The sidebar's Devices: the paired iPhone (connected, or when it was last seen) and other machines' threads"
macos = "yes"
windows = "yes"
how = { macos = "The same on both.", windows = "The same on both: seen on a Windows PC's installed Trek (Devices › iPhone, last seen 33 minutes before)." }
code = ["crates/trek-app/src/sidebar.rs"]
tests = ["crates/trek-app/tests/sidebar.rs"]

[[feature]]
id = "computer-name"
area = "Machines"
what = "This computer goes by one name, to the iPhone and to other machines"
macos = "yes"
windows = "yes"
how = { macos = "Sharing's computer name.", windows = "The DNS host name for both: machine pairing used COMPUTERNAME, the upper-case NetBIOS name (T-BOOK for T-Book), until this audit." }
code = ["crates/trek-app/src/remote.rs", "crates/trek-app/src/machines.rs"]
