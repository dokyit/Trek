windows = "partial"
how = { macos = "whisper when it's installed, else the Speech framework.", windows = "whisper only." }
note = "Without whisper a Windows transcript is missing: Windows' speech recognizer can't read a file. Bundling whisper (or whisper.cpp) would close it."
