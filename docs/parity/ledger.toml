how = { macos = "Trek's own authenticator (`trek-passkeys`): pages' `navigator.credentials` requests are answered natively, after Trek's bar (or an agent thread's approval card) and Touch ID, with keys the Mac's Secure Enclave holds. A list with Delete, and a switch, in Settings › Tools & MCP › Browser.", windows = "WebView2's own (Chromium's WebAuthn through Windows' `webauthn.dll`: Windows Hello, security keys, a phone); Trek adds nothing, and Windows keeps and lists those passkeys." }
note = "macOS: only passkeys made in Trek's Browser work, and they stay on this Mac. The ones in iCloud Keychain or a password manager, security keys and \"use a phone\" would need Apple's managed entitlement `com.apple.developer.web-browser.public-key-credential`, which takes an Apple-issued provisioning profile that Trek's own signing certificate can't have (a Developer ID and Apple's approval of Trek as a browser would bring them); frames inside a page aren't answered. Windows: WebView2 hands pages Windows' WebAuthn as Edge does, but it has not been tried in Trek on a PC yet, so it stays partial until someone signs in with one there (`a_real_webview2_gives_pages_webauthn_of_its_own` reads what a page sees); an agent driving the Browser there gets Windows' own Hello prompt, with no approval card of Trek's first. Linux: WebKitGTK is built without WebAuthn (`ENABLE_WEB_AUTHN` off in every release so far), so pages have no `PublicKeyCredential`; Trek's authenticator could answer there too (keys in the Secret Service), which is not built."
