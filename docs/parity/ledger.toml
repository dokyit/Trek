# What every user-facing feature does on each platform. Checked by `cargo test -p trek-parity` on
# both platforms' CI (see docs/CROSS_PLATFORM.md); docs/PARITY.md is generated from it.
#
#   macos / windows  "yes": works as on the other platform (`how` says where it's done another way)
#                    "partial": works with less;  "no": isn't there;  "n/a": means nothing there.
#   note             required for "partial" and "no": what's missing, why, and what would bring it.
#   code / tests     where the platform split is, and what covers it (files that exist).
#
# A change that adds or removes a platform gate (`cfg(windows)`, `cfg!(target_os = "macos")`)
# updates the feature it belongs to here, then records the counts:
#   TREK_PARITY_UPDATE=1 cargo test -p trek-parity

