# ---------- Agents ----------

[[feature]]
id = "direct-agents-shell"
area = "Agents"
what = "API-key and local-model agents run shell commands"
macos = "yes"
windows = "partial"
how = { macos = "bash.", windows = "cmd.exe, and the model is told bash syntax won't work." }
note = "Models write bash far more reliably than cmd. Git Bash (Git for Windows is already needed) or PowerShell 7 would serve them better."
