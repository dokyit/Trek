area = "Agents"
what = "OpenCode asks before edits and commands as the thread's access level says, and its 1.x and 2 share one history"
macos = "yes"
windows = "yes"
linux = "yes"
live = ["opencode-history 4"]
how = { macos = "An administrator's OpenCode config is read from /Library/Application Support/opencode.", windows = "An administrator's is read from %ProgramData%\\opencode. The user's own is ~/.config/opencode on both: OpenCode finds it from the home folder, not %APPDATA%." }
note = "Its scratch run of 1.x reads nothing of the user's on either platform (HOME, USERPROFILE and the XDG folders all point into it). The live check reads a database 1.x and 2 both wrote (trek-core's fixture) through the app, on both platforms: 4 threads, a session in both once. OpenCode's asks are its own CLI's, which an isolated run never starts: rules_live.rs drives it against a stand-in."
code = ["crates/trek-agents/src/opencode.rs"]
tests = ["crates/trek-agents/src/opencode.rs"]

