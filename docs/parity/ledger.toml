live = ["route project:{project}", "tools browser", "wait 600", "browser go https://example.com", "wait 3000", "browser expect loaded", "browser crash", "wait 3000", "browser expect crashed loaded", "browser crash", "wait 3000", "browser expect crashed failed:example.com", "browser go http://127.0.0.1:39999/", "wait 3000", "browser expect failed:127.0.0.1:39999 why:running", "browser go http://127.0.0.1:9/", "wait 3000", "browser expect failed:127.0.0.1:9 why:kept"]
live_linux = ["route project:{project}", "tools browser", "wait 600", "browser go https://example.com", "wait 3000", "browser expect loaded", "browser crash", "wait 3000", "browser expect crashed loaded", "browser crash", "wait 3000", "browser expect crashed failed:example.com", "browser go http://127.0.0.1:39999/", "wait 3000", "browser expect failed:127.0.0.1:39999 why:running"]
note = "Checked against a real WebView2 on Windows 11: a refused connection (127.0.0.1:39999) gets Trek's \"Can't reach this page\" with its reason, and port 9 \"Can't open this page\", saying why, and links handed to another app (mailto:, a custom scheme) leave the page as it was; the six real-WebView2 tests pass. The mapping is plain code, so the Mac's CI checks the Windows words too. The crash page now points to \"Open in default browser\", which both platforms' ⋯ menus have (it said Safari). A port browsers keep pages off (the Fetch standard's list: 9, 22, 25…) is said as that on both platforms (\"Port 9 is kept for another kind of service…\"), not as a server that isn't running: WebView2 shows its own page for it with a status it calls unknown, and WebKit stops it before it starts. A newer WebKit reports that as its \"restricted port\" error (103, which Trek called its ad blocker's), and an older one, macOS 15's in CI, showed an empty page and reported nothing, leaving the tab blank; Trek's delegate now says it before WebKit is asked. The live check loads a closed port and port 9, and reads the reason Trek's page gives for each. Linux: a failed load and a page whose web process ended say so on Trek's page (WebKitGTK's load-failed and web-process-terminated, its GLib errors given as the Mac's codes, `webkitgtk.rs`); a port browsers keep pages off (9) shows a blank page, as WebKitGTK reports nothing for it, so its live check is left out there."
how = { macos = "WebKit's errors (NSURLErrorDomain, WebKitErrorDomain) and its web content process ending.", windows = "WebView2's: a load it put its own error page up for (ContentLoading's IsErrorPage), with NavigationCompleted's WebErrorStatus in Trek's words (an unknown status, as for a refused connection, said as unreachable); a load only stopped (a link handed to another app, a download) and a server's own 404 page are left alone. ProcessFailed for the page's own process (exited, or unresponsive) is a crash: reloaded, then explained if it ends again." }
tests = ["crates/trek-app/src/panels/browser/asks.rs", "crates/trek-app/src/panels/browser.rs", "crates/trek-app/tests/browser.rs"]
code = ["crates/trek-app/src/panels/browser.rs", "crates/trek-app/src/panels/browser/webview2.rs", "crates/trek-app/src/panels/browser/asks.rs"]

