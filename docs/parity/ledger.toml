macos = "yes"
windows = "yes"
how = { macos = "The server's command, as it is.", windows = "Node won't start a `.cmd`, so for Claude Code and ACP agents a server started through a batch script (npx.cmd) runs under `cmd /c`; when cmd.exe can't carry its arguments (`& | < > ^ %`, a quote, a line break, a space in its folder) and the script is npm's shim (Node's own npx.cmd, a global package's), it goes to Node and the script the shim would run, global npm included. Codex is given the script, which it quotes itself. A batch script of the user's own can't be given such arguments: it's left out, with a notice saying why." }
