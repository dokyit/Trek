[[feature]]
id = "capture-build"
area = "Development"
what = "The capture build (`shots`): an isolated Trek that trek-dev drives with commands and captures, to verify a change"
macos = "yes"
windows = "partial"
live = ["count title-text 1", "signed-out"]
how = { macos = "trek-dev. No Dock tile, and every window opens on a display of the run's own (Trek Test Display), so nothing is on the owner's screens and macOS keeps drawing it; `windows` and `screenshot --real` capture its real pixels. Pages and previews are snapped by WebKit or cropped from a capture of the window (Screen Recording); `browser press` sends a page real keys through AppKit; extensions' popups and options pages can be driven.", windows = "trek-dev.ps1. The window opens behind the owner's (TREK_BACKGROUND), where Windows keeps drawing it, so it needs no display of its own (`--real` is refused); pages and previews are snapped by WebView2. `hittest`, `realclick`, `realmove` and `realleave` check what the window answers WM_NCHITTEST and send its own handle a real click or a leave." }
note = "On Windows: no `browser press` (a key into a page that WebView2 handles itself; WebView2's DevTools Input.dispatchKeyEvent would do it), and no capture of a whole window's real pixels with its web views (PrintWindow with PW_RENDERFULLCONTENT, or Windows.Graphics.Capture, would). `checks-demo`'s stand-in `gh` is a batch file there (`gh.cmd`; a Mac's is a `#!/bin/sh` script), so the failing checks' bar is shown on both. Extensions' popups and options pages are the Mac's alone because WebView2 has none (browser-extensions). Its terminal starts a real shell for a live check on Windows alone (`TREK_VERIFY_SHELL`: PowerShell with -NoProfile, cmd with /d, never a job's command); an isolated run on a Mac keeps its stand-in, as a Mac's login shells have no one flag that skips their start-up files. Its stand-in iPhone (`pair-phone`) pairs over the real protocol with a phone server on the loopback alone, on both. Its `second-launch` (Trek started again, handing a link over through `single_instance`) is Windows' alone: a Mac hands a second launch to the running app itself, which its `open-link` stands for."
code = ["crates/trek-app/src/shots.rs", "crates/trek-app/src/test_display.rs"]
tests = ["crates/trek-app/src/test_display.rs"]

