what = "The model picker names models as their CLIs do"
macos = "yes"
windows = "yes"
how = { macos = "The same on both.", windows = "The same on both: a Claude Code without its downloaded model list is named from the model ids (Opus 5.5, not opus)." }
code = ["crates/trek-core/src/catalog.rs"]
tests = ["crates/trek-core/src/catalog.rs", "crates/trek-agents/src/status.rs"]

[[feature]]
id = "accounts"
area = "Agents"
what = "Several accounts for one agent, sharing your setup"
macos = "yes"
windows = "partial"
how = { macos = "Symlinks to your setup.", windows = "Folders become junctions." }
note = "Files (CLAUDE.md, settings.json) are copied once and stop following the original, unless Developer Mode allows symlinks. Hard links would keep them in step."
code = ["crates/trek-core/src/accounts.rs"]

[[feature]]
id = "skills-symlinks"
area = "Agents"
what = "Skills keep the symlinks inside them when copied or moved"
macos = "yes"
windows = "partial"
note = "Dropped on Windows, without a word. Junctions for folders and copies for files, said when it happens."
code = ["crates/trek-core/src/skills.rs"]

