how = { macos = "No `..`, no leading `/`; `/` makes folders only where nesting is allowed.", windows = "The same, and Windows' own rules: `\\` separates too, no drive or share (`C:`, `\\\\server`), no `:` (a hidden stream), no `<>\"|?*` or control characters, no device names (CON, NUL, COM0-9, LPT0-9) or names ending in a dot or space. The rules are a value, so the Mac's CI checks Windows' too." }
note = "Found by the 2026-11 sweep and fixed: before, `..\\x` and `C:\\x` made or moved an item outside the folder on Windows, and `todo:v2.md` wrote a hidden stream of `todo`. Left: a case-only rename in a case-sensitive (WSL) folder is judged by size and time (same_file)."
code = ["crates/trek-app/src/panels/explorer.rs"]
tests = ["crates/trek-app/src/panels/explorer.rs"]

