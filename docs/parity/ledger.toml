[[feature]]
id = "video-tools-download"
area = "Agent tools"
what = "ffmpeg and yt-dlp for the video watcher come from Trek itself where no package manager has installed them"
macos = "yes"
windows = "yes"
linux = "yes"
live = ["route settings:tools", "wait 300", "media-demo failed yt-dlp", "wait 300", "reveal yt-dlp-media-status", "count yt-dlp-media-status 1", "count install-yt-dlp 1"]
live_linux = ["route settings:tools", "wait 300", "media-demo failed yt-dlp", "wait 300", "reveal yt-dlp-media-status", "count yt-dlp-media-status 1", "count install-yt-dlp 1", "media-demo install ffmpeg", "wait file tools/ffprobe 180000", "file tools/ffmpeg", "wait 1500", "media-demo install yt-dlp", "wait file tools/yt-dlp 180000", "wait 1500", "count video-tools 1"]
how = { macos = "Martin Riedl's static ffmpeg and ffprobe 9.0.2 (ffmpeg.martin-riedl.de: one zip each for Apple silicon and for Intel, signed with his Developer ID, a .sha256 beside each), pinned by URL and SHA-256 in trek_core::media_tools; yt-dlp's own `yt-dlp_macos` from its latest GitHub release, checked against that release's SHA2-256SUMS.", windows = "Gyan Doshi's \"essentials\" ffmpeg 8.1.2 for x86-64 (GitHub GyanD/codexffmpeg, the same file and SHA-256 gyan.dev publishes), whose ffmpeg.exe and ffprobe.exe are taken out of the zip; yt-dlp's own `yt-dlp.exe`, checked against its release's SHA2-256SUMS. There is no ARM64 build: a Windows on ARM falls back to winget's line.", linux = "The same build server's Linux builds of ffmpeg and ffprobe 9.0.2, one zip each for x86-64 and for Arm64, pinned by URL and SHA-256 (each file downloaded and hashed when it was pinned, and equal to the .sha256 beside it). They link only the system's C and C++ libraries (glibc 2.35 and GCC 12's libstdc++, which Ubuntu 22.04 has: the oldest Linux Trek's own build runs on). yt-dlp's own `yt-dlp_linux` and `yt-dlp_linux_aarch64`, checked against the release's SHA2-256SUMS. No sudo. Where a download can't be made, Settings offers the distribution's package manager, whichever of apt, dnf, pacman and zypper is there, run in Trek's terminal where it asks for the password itself." }
note = "The first `watch_video` (and Settings › Tools › Video's Install ffmpeg / Install yt-dlp, with progress) downloads what's missing into the folder `media_tools::dir` names (local app data on Windows, the data folder on a Mac and on Linux), checks it against its SHA-256, starts it once with -version, and only then puts it in place; PATH and the package managers' folders come first, so an ffmpeg that's already there is used. Where a download can't be made Settings says why and offers the package manager that's here (Homebrew, winget, a Linux distribution's own: `media_tools::package_managers`). A file Trek downloads itself isn't quarantined, so Gatekeeper never asks about it (and the Mac builds are signed and notarized anyway). Checked on a Mac: with Homebrew's ffmpeg hidden from trek-mcp (a sandbox profile), the first watch_video of a generated clip downloaded both programs in 3 s and watched it, a second call used them at once, and with the network blocked it said why and left nothing behind; and the isolated app downloaded ffmpeg for real into its data folder from Settings' row (capture build: media-demo), with its progress shown. The Windows download isn't run on a PC here: its URL, size and SHA-256 are the ones the two sources publish, and the unpacking is tested with a made-up zip laid out as theirs is. Linux: the live run on CI's Ubuntu 22.04 (x86-64) downloads ffmpeg, ffprobe and yt-dlp for real into the run's data folder (`media-demo install`), each checked and started once before it's kept, so every pull request's run needs the two servers up. The Arm64 downloads aren't run anywhere: their URLs, sizes and SHA-256 were read off the files themselves the day they were pinned, each an ELF program for aarch64 that needs the same libraries as the x86-64 one. On a Linux older than Trek supports (glibc before 2.35) the downloaded ffmpeg wouldn't start, and isn't kept: Settings then says why and offers the package manager."
code = ["crates/trek-core/src/media_tools.rs", "crates/trek-core/src/detect.rs", "crates/trek-mcp/src/video.rs", "crates/trek-integrations/src/lib.rs", "crates/trek-app/src/workspace/media_setup.rs", "crates/trek-app/src/settings_view.rs"]
tests = ["crates/trek-core/src/media_tools.rs", "crates/trek-mcp/src/video.rs", "crates/trek-app/tests/settings_pages.rs", "crates/trek-app/src/workspace.rs"]

