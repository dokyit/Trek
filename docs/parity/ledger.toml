note = "The live screen and taps: the Mac's ways (CoreMediaIO capture, Bluetooth HID, iPhone Mirroring, Trek Driver built and signed in Xcode) are Mac-only, but CoreDevice's own services, the ones Xcode's Device Hub uses (a screenshot service, the display service's media stream, and the HID back channel dtuhidd serves), reach a phone from a PC over its RemoteXPC tunnel with nothing to build or sign: `cargo run -p trek-phone --features coredevice --example pc_screen -- --ddi <folder> --tap <x> <y>` mounts the developer disk image (Xcode's personalized one, signed for the phone by Apple's server), saves a screenshot and taps. It builds and runs on Windows (Apple Mobile Device Service answered on the PC it was written on; no phone was plugged in), and hasn't yet run against a phone: that, then the panel's screen and agents' screenshot and tap tools on it, is what's left. The disk image is Apple's, from Xcode on a Mac."
