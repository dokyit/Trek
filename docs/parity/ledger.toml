live_linux = ["route project:{project}", "pace 0", "send mock:video", "wait idle 60000", "wait 800", "count trek-artifact-* 1+", "reveal-in transcript-scroll watched-strip*", "count watched-strip* 1+", "count watched-frame* 1+"]
how = { macos = "whisper when it's installed, else the Speech framework.", windows = "whisper when it's installed, else Whisper in Trek itself: trek-mcp transcribes on the PC with dictation's engine (trek-dictate) and the speech model the mic downloaded, whose folder Trek names in TREK_DICTATION_DIR. It never downloads the model for a video: without it, the agent is told the composer's mic gets it (141 MB) or to install whisper.", linux = "whisper when it's installed (on the PATH, or in ~/.local/bin where pipx puts it). Nothing else: without it watch_video returns the frames all the same, and its answer tells the agent that a transcript needs the whisper command and how the user gets it (video.rs's own_transcriber and WHISPER_NEEDED)." }
note = "Checked on a Windows 11 PC (i7-13700H): a generated clip with a sentence spoken a second in, watched from 0:01, comes back word for word as [0:01.0–0:06.0] on the video's clock, in 2.7 s for the whole call (trek-mcp's video tests, where the model is present; they pass as skipped where it isn't, as on CI). A first-time Windows user gets transcripts once dictation has been used once, where a Mac asks for Speech Recognition the first time. A winget install of ffmpeg (what Settings' \"Use winget\" runs where Trek's own download failed) without Developer Mode puts the package's own folder on the user's Path rather than in its Links: Settings (detect::which_now) and watch_video (trek-mcp's find_executable) read the registry's Path as it is now, so it's found without restarting Trek. Linux: the watcher itself is there as on the others (`trek-mcp video`, every session's trek-video server, Settings › Tools › Video), with ffmpeg from the PATH or Trek's own download: CI's Linux job watches a generated clip (trek-mcp's video tests, with the runner's ffmpeg), and the live run watches the mock agent's clip through the session's own server and shows the strip of frames it got back (the steps there count the strip, which the others' don't yet). Its transcripts are partial: Trek has no speech recognizer of its own on Linux. Dictation's Whisper (trek-dictate's windows module, over vendor/whisper-rs-sys) is built for Windows alone, its speech model is downloaded over WinHTTP by the composer's mic, and Linux has no mic button to download it with (see dictation). What would close it: build whisper-rs on Linux (CMake and libclang on the build image), move transcribe_wav and the model's download out of the Windows module, and give Settings › Tools › Video a button for the model (141 MB). Also on Linux: a direct https link to a media file is fetched with curl, which a stock Ubuntu desktop doesn't install; the tool says it needs curl."
code = ["crates/trek-mcp/src/video.rs", "crates/trek-mcp/src/main.rs", "crates/trek-dictate/src/lib.rs", "crates/trek-dictate/src/windows/local.rs", "crates/trek-app/src/workspace.rs", "crates/trek-mcp/src/util.rs", "crates/trek-core/src/detect.rs", "crates/trek-integrations/src/lib.rs"]
tests = ["crates/trek-mcp/src/video.rs", "crates/trek-dictate/src/windows/local.rs", "crates/trek-app/src/workspace.rs", "crates/trek-mcp/src/util.rs", "crates/trek-core/src/detect.rs", "crates/trek-words/src/lib.rs"]

