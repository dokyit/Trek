# ---------- Tools ----------

[[feature]]
id = "iphone-tool"
area = "Tools"
what = "The iPhone tool: your real iPhone for you and agents"
macos = "yes"
windows = "partial"
how = { macos = "Live screen over USB, keyboard and mouse over Bluetooth, iPhone Mirroring or Trek Driver for taps, apps and files.", windows = "Through Apple Devices (Apple Mobile Device Service, from the Microsoft Store): the phone's details, its apps (list, install an .ipa) and files (media, and apps' Documents: add, save, remove), AssistiveTouch, and agents' eight phone tools for them, one agent at a time, with installs and file changes asked first. The panel says what's missing: Apple Devices, its service, a phone, Trust, unlocking." }
note = "The live screen and taps need Trek on a Mac: CoreMediaIO capture, Bluetooth HID, iPhone Mirroring and starting Trek Driver (Xcode) are Mac-only. idevice's XCTest and screenshots build on Windows, but iOS 17 and later need the developer disk image mounted, and the driver is built and signed on a Mac."
code = ["crates/trek-phone/src/lib.rs", "crates/trek-phone/src/pc.rs", "crates/trek-app/src/panels/mod.rs", "crates/trek-app/src/panels/phone/windows.rs"]
tests = ["crates/trek-app/tests/iphone.rs", "crates/trek-phone/src/pc.rs"]

[[feature]]
id = "simulator"
area = "Tools"
what = "The iOS Simulator tool"
macos = "yes"
windows = "n/a"
how = { macos = "simctl and AXe.", windows = "The Simulator comes with Xcode, which is Mac-only: Settings says so. An Android emulator tool would be the Windows counterpart." }
code = ["crates/trek-app/src/workspace.rs"]

[[feature]]
id = "browser-popups"
area = "Browser"
what = "Popups that keep their opener (sign-ins that answer the opening page)"
macos = "yes"
windows = "partial"
note = "WebView2 popups open as plain tabs with no window.opener, so sign-ins that post back to the opening page can't finish. NewWindowRequested with a deferral and SetNewWindow, and WindowCloseRequested."
code = ["crates/trek-app/src/panels/browser.rs"]

[[feature]]
id = "browser-asks"
area = "Browser"
what = "A page's dialogs and permission asks in Trek's bar; answered for an agent at work"
macos = "yes"
windows = "no"
note = "WebView2's own dialogs show instead, and a JavaScript dialog can stall an agent until the user closes it. ScriptDialogOpening, PermissionRequested and LaunchingExternalUriScheme, fed into the existing asks."
code = ["crates/trek-app/src/panels/browser/asks.rs"]

[[feature]]
id = "browser-downloads"
area = "Browser"
what = "Downloads said in Trek's toasts"
macos = "yes"
windows = "yes"
how = { macos = "WebKit's downloads, through wry.", windows = "WebView2's, through wry; taking them hides WebView2's own flyout, so Trek's toasts say it." }
code = ["crates/trek-app/src/panels/browser.rs"]

[[feature]]
id = "browser-crash"
area = "Browser"
what = "A crashed page reloads, and a failed load says why"
macos = "yes"
windows = "partial"
note = "A generic error page only. WebView2's ProcessFailed, and its WebErrorStatus mapped to words."
code = ["crates/trek-app/src/panels/browser.rs"]

[[feature]]
id = "block-trackers"
area = "Browser"
what = "Block trackers"
macos = "yes"
windows = "yes"
how = { macos = "Block ads and trackers: the big ad and tracker networks, as WebKit content rules.", windows = "Block trackers: Edge's Strict tracking prevention, the WebView2 profile's level (ads are the imported ad blocker's)." }
code = ["crates/trek-app/src/panels/browser.rs"]

[[feature]]
id = "ad-blocker"
area = "Browser"
what = "Import your uBlock Origin as the ad blocker"
macos = "yes"
windows = "partial"
how = { macos = "Its rules converted to content rules; a folder, .zip or .crx; Allow ads on this site.", windows = "Installed as a Manifest V2 extension, from its folder." }
note = "No per-site allow on Windows, and it stops working when Edge drops Manifest V2 (planned for 2027). The Mac's rule conversion through WebView2's request filtering would replace it."
code = ["crates/trek-app/src/panels/browser_adblock.rs"]

[[feature]]
id = "browser-extensions"
area = "Browser"
what = "Browser extensions with their button, popup and options"
macos = "yes"
windows = "partial"
note = "WebView2 runs unpacked extensions' content scripts only: no toolbar button, popup or options page. Those pages hosted in a Trek-made view would close it."
code = ["crates/trek-app/src/panels/browser_extensions.rs"]

[[feature]]
id = "terminal-previews"
area = "Tools"
what = "Terminal, editor previews and interactive artifacts"
macos = "yes"
windows = "yes"
how = { macos = "A PTY and WebKit.", windows = "ConPTY and WebView2 (artifacts InPrivate)." }
code = ["crates/trek-app/src/panels/terminal.rs"]

