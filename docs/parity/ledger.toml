how = { macos = "WebKit's WKWebExtension, with Trek's shim for the Chrome APIs it lacks (compat.rs, trek-shim.js) and a channel of Trek's through WebKit's native messaging (bridge.rs, channel.rs): chrome.notifications as Trek's banners (clicks and buttons come back), offscreen documents, identity.launchWebAuthFlow in a sign-in window, idle, downloads to Downloads, privacy (read-only), management, sidePanel, commands, webRequest's option names and iframe requests reported as sub_frame, declarativeNetRequest batches without the regular expressions WebKit can't run, sender.origin, and native messaging to the hosts Chrome finds (asked once per extension and host). DevTools panels (React Developer Tools' Components and Profiler) open from the ⋯ menu in a window of Trek's. Store extensions update daily. Measured 2026-11-27: uBlock Origin Lite, Dark Reader, Vimium, Privacy Badger and React Developer Tools work; Bitwarden, 1Password and Grammarly run up to where a real account is needed. Block ads on every site: the Extensions page's first card (and the ⋯ menu) installs uBlock Origin Lite with one confirmation.", windows = "WebView2's profile extensions: the same page and Block ads card, content scripts and rules only." }
note = "WebView2 runs unpacked extensions' content scripts only: no toolbar button, popup or options page. Those pages hosted in a Trek-made view would close it. The starters say so on Windows (catalog.rs's webview2 fit): Bitwarden and 1Password can't work (the vault is the popup), Grammarly, Dark Reader and uBlock Origin Lite partly. The ⋯ menu's Block ads row is the Mac's alone (WebView2 lists its extensions only from a view); the page's card is on both. Linux: WebKitGTK runs no web extensions. Trek's added APIs (notifications, native messaging, DevTools panels, updates) are the Mac's: WebView2 runs Chromium's own extension APIs, whose coverage there hasn't been tried in Trek. Linux: WebKitGTK runs no web extensions (WebKitGTK has no WKWebExtension; a port would need one)."
code = ["crates/trek-app/src/panels/browser_extensions.rs", "crates/trek-app/src/panels/browser_extensions/catalog.rs", "crates/trek-app/src/panels/browser_extensions/compat.rs", "crates/trek-app/src/panels/browser_extensions/bridge.rs", "crates/trek-app/src/panels/browser_extensions/channel.rs", "crates/trek-app/src/panels/browser_extensions/updates.rs"]

[[feature]]
id = "terminal-previews"
area = "Tools"
what = "Terminal, editor previews and interactive artifacts"
macos = "yes"
windows = "yes"
linux = "partial"
live = ["route project:{project}", "tools terminal", "wait 1500", "count terminal 1"]
how = { macos = "A PTY and WebKit.", windows = "ConPTY and WebView2 (artifacts InPrivate).", linux = "A PTY and WebKitGTK, its views in X11 child windows of Trek's; a card's page stands on the card's colour." }
note = "On Windows a live inline artifact's clipping window ignores round_bottom, so its square bottom corners cover the card's rounded ones, and every web-view failure there says the WebView2 runtime is needed, dropping the real reason the Mac shows (artifact/native.rs, artifact/mod.rs). Linux: a card's page can't show through (no see-through X11 child windows), and a card covered by a menu isn't swapped for a picture of its page (no snapshot is taken). A page's link opens in the browser only on the user's own click, which each platform sees its own way: on the Mac every mouse button and key AppKit hands the app is noted before it's dispatched, on Linux GTK's signals on the view, on Windows (where the page's input never reaches the app) WebView2's own word on each request, IsUserInitiated. What a page's policy has no directive for is closed per engine: WebRTC and link preconnect by WebKit's feature switches on the Mac, on Linux WebRTC by WebKitGTK's setting and preconnect by its feature switches, which need WebKitGTK 2.42 (an older one leaves preconnect to the page), and on Windows by the Connection-Allowlist header, which WebView2 152 and later enforce (an older runtime leaves preconnect, and WebRTC from a frame the page writes itself, to the page)."
code = ["crates/trek-app/src/panels/terminal.rs", "crates/trek-app/src/artifact/native.rs", "crates/trek-app/src/artifact/mod.rs", "crates/trek-app/src/linux_gtk.rs"]
