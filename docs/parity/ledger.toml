[[feature]]
id = "dictation"
area = "Composer"
what = "Dictate a message with the mic button, with live words and a level meter"
macos = "yes"
windows = "yes"
linux = "no"
live = ["dictate-demo the chain rule", "wait 300", "count voice-row 1", "count voice-confirm 1", "click voice-cancel"]
how = { macos = "AVAudioEngine into Apple's Speech framework (on the device when it can).", windows = "On the PC: Whisper (whisper.cpp, the multilingual base model) over the default microphone as WASAPI records it, resampled to 16 kHz; the words are decoded about once a second as they come and once more after ✓. The model (141 MB) downloads from Hugging Face the first time the mic is clicked, with its progress in the voice row, resumed if interrupted and checked against its SHA-256; Settings › General › Dictation removes it. A muted or switched-off microphone, being offline and a full disk are said in words. A packaged Trek uses Windows' own online recognizer (Windows.Media.SpeechRecognition) instead, which Windows answers only with package identity; Win+H only where neither can run (a processor without AVX2), and the mic says so." }
note = "Checked on a Windows 11 PC (i7-13700H): \"Trek can now take dictation on Windows\" from Windows' speech synthesizer comes back word for word through the engine's own passes (the test runs where the model is downloaded; the last pass takes 0.9 s over 3.6 s of speech). The isolated app downloaded the model on the first click of the mic with its progress in the voice row, opened the microphone (48 kHz stereo, resampled), put a recording's words in the composer, and Settings removed the model. A sentence played through the same laptop's speakers isn't heard at all (its Intel Smart Sound microphone array cancels the PC's own output and the room's noise), so a person tested it: speaking into the PC's microphone in the isolated app, their words (\"Hello? … Can you hear me?\") went into the composer as typed text after ✓, the model loaded in 0.12 s, and a second take ended with ✕ added nothing. Whisper is slower than Apple's on-device recognizer: the first words show a second or two after speaking starts. The model is kept in %LOCALAPPDATA% (not the roaming profile). Whisper left to itself writes some takes plainly, all lowercase without stops (a slow \"Use the chain rule to find the derivative of sine of x squared.\" came back as \"use the chain rule … squared\"): a take's last pass that comes back so is decoded again after a punctuated prompt, and an English take goes in with a capital and a closing stop, as the Mac's does. Only the last pass is prompted: given to every pass, the prompt changed takes that were right (\"Hello? Hello?\" lost its stops). The quick passes over the first words as they come went round and round on that sentence (\"Use the chain rule to use the chain rule to …\"), prompt or none, and a take over 20 s can settle such a pass into its text: a pass that hears more words than anyone says in its time is dropped. whisper.cpp's language guess includes Cantonese, which the base model doesn't have (its chance is the translate token's): a quick pass guessed it for plain English, and the take was decoded as Cantonese; that guess is no guess now. Linux: no mic button: no speech recognizer there yet. Windows' whisper model would run, but the recording would need Linux's own audio input (PipeWire or ALSA)."
code = ["crates/trek-dictate/src/lib.rs", "crates/trek-dictate/src/windows/mod.rs", "crates/trek-dictate/src/windows/local.rs", "crates/trek-dictate/src/windows/model.rs", "crates/trek-app/src/composer.rs", "crates/trek-app/src/composer/voice.rs", "crates/trek-dictate/src/windows/hints.rs"]
tests = ["crates/trek-dictate/src/windows/logic.rs", "crates/trek-dictate/src/windows/local.rs", "crates/trek-dictate/src/windows/model.rs", "crates/trek-dictate/src/windows/transcript.rs", "crates/trek-dictate/src/windows/audio.rs", "crates/trek-app/tests/composer.rs", "crates/trek-dictate/examples/winrt_probe.rs"]

[[feature.promise]]
what = "A take comes back written, with capitals and full stops"
windows = "crates/trek-dictate/src/windows/local.rs::a_take_comes_back_written_with_capitals_and_stops"
untested = { macos = "Apple's recognizer is asked to punctuate (setAddsPunctuation, crates/trek-dictate/src/lib.rs); no test drives Speech, which asks the user's permission first." }

