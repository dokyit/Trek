note = "Checked on a Windows 11 PC (i7-13700H): a generated clip with a sentence spoken a second in, watched from 0:01, comes back word for word as [0:01.0–0:06.0] on the video's clock, in 2.7 s for the whole call (trek-mcp's video tests, where the model is present; they pass as skipped where it isn't, as on CI). A first-time Windows user gets transcripts once dictation has been used once, where a Mac asks for Speech Recognition the first time. Settings' \"Install ffmpeg\" runs `winget install ffmpeg`, which without Developer Mode puts the package's own folder on the user's Path rather than in its Links: Settings (detect::which_now) and watch_video (trek-mcp's find_executable) read the registry's Path as it is now, so it's found without restarting Trek."
