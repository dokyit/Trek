[[feature]]
id = "snapshots"
area = "Composer"
what = "Snapshot a window, an area or the screen into the message"
macos = "yes"
windows = "partial"
linux = "partial"
live = ["route settings:app-snapshots", "wait 300", "reveal snap-keep*", "count snap-keep* 2+"]
live_linux = ["route settings:app-snapshots", "wait 300", "reveal snap-format*", "count snap-format* 2", "reveal snap-keep*", "count snap-keep* 2+", "route project:{project}", "wait 300", "click attach", "wait 400", "count plus-snapshot-screen 1", "click plus-snapshot-screen", "wait shown attachment#0 60000", "count attachment#* 1+"]
how = { macos = "screencapture: window, area or screen; hide Trek; shadow; sound; PNG or JPG.", windows = "Snipping Tool's overlay, its result read from the clipboard.", linux = "The desktop's screenshot portal (org.freedesktop.portal.Screenshot, asked with `interactive`: the desktop's own picker for a window, an area or the screen), its file read into Trek's snapshots; in an X11 session the whole screen from the X server (GetImage on the root window). Hide Trek (its windows minimized, and mapped back); PNG or JPG." }
note = "Snipping Tool overwrites the clipboard, a cancelled snip can't be told apart from a slow one (Trek gives up after 60 s), and it's PNG only. Windows.Graphics.Capture with Trek's own area overlay would match the Mac. The Mac's own path (screencapture, Trek hidden while it runs, the shadow/sound/format settings) has no fake and no test; only Windows' Snipping Tool path and Linux's desktop path are tested. Linux: the + menu, the shortcut and Settings › App Snapshots offer what the session can take, found out the first time one of them asks (a runtime value, `screenclip::desktop`; starting Trek itself doesn't start the portal). With a portal: Take a snapshot (the desktop's picker) and Snapshot the screen. In an X11 session without one (a bare window manager, CI's Xvfb): Snapshot the screen alone, which the shortcut takes too, and Settings say that picking needs the portal. With neither (a Wayland compositor with no portal): no rows and no page, and the shortcut says why. What differs from the Mac: the desktop's picker decides between a window and an area, so Settings' choice is what you pick or the screen; no window shadow or shutter sound (screencapture's own); the portal keeps a copy of its own where the desktop saves screenshots — GNOME's in ~/Pictures, KDE's a temporary file in /tmp (xdg-desktop-portal-kde.*) — and its API has no way to ask it not to or to delete it, so Trek leaves it (Settings › App Snapshots says so); a desktop may ask before a whole-screen snapshot through the portal (a Wayland session); in an X11 session the screen is every monitor in one picture; under Xwayland the X server shows X11 windows only, so it's never used there. Seen live on CI's Xvfb: the X server path alone. The portal path is tested against a desktop of the tests' own answering as GNOME's and KDE's portals do, on every CI; no runner has a portal, so nobody has yet run it, or Hide Trek under a real window manager, on GNOME or KDE."
code = ["crates/trek-screenclip/src/lib.rs", "crates/trek-screenclip/src/desktop.rs", "crates/trek-app/src/composer.rs"]
tests = ["crates/trek-app/tests/snapshots.rs", "crates/trek-screenclip/src/desktop.rs"]

