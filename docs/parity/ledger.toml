# What every user-facing feature does on each platform. Checked by `cargo test -p trek-parity` on
# both platforms' CI (see docs/CROSS_PLATFORM.md); docs/PARITY.md is generated from it.
#
#   macos / windows  "yes": works as on the other platform (`how` says where it's done another way)
#                    "partial": works with less;  "no": isn't there;  "n/a": means nothing there.
#   note             required for "partial" and "no": what's missing, why, and what would bring it.
#   code / tests     where the platform split is, and what covers it (files that exist).
#
# A change that adds or removes a platform gate (`cfg(windows)`, `cfg!(target_os = "macos")`)
# updates the feature it belongs to here, then records the counts:
#   TREK_PARITY_UPDATE=1 cargo test -p trek-parity

# ---------- The app ----------

[[feature]]
id = "keep-working-window-closed"
area = "App"
what = "Agents keep working with Trek's window closed"
macos = "yes"
windows = "partial"
how = { macos = "The app stays up in the Dock; the Dock icon reopens the window.", windows = "Closing the window with agents at work asks: Keep Working closes Trek's windows and quits once the work is done (after a grace for its banners), and opening Trek or the tray icon brings the window back. With nothing at work, closing quits." }
note = "Windows has no Dock: Trek doesn't stay up idle with no window. A setting to stay in the tray indefinitely would match the Mac fully."
code = ["crates/trek-app/src/root.rs", "crates/trek-app/src/lib.rs"]
tests = ["crates/trek-app/tests/titlebar.rs"]

[[feature]]
id = "menus"
area = "App"
what = "Trek's commands in menus"
macos = "yes"
windows = "yes"
how = { macos = "The system menu bar.", windows = "No menu bar (Windows apps have none of the Mac's kind): every menu command is in the palette, Settings or a context menu." }
code = ["crates/trek-app/src/lib.rs"]

[[feature]]
id = "app-badge"
area = "App"
what = "Threads waiting on you, counted on the app's icon"
macos = "yes"
windows = "yes"
how = { macos = "Dock badge.", windows = "Overlay badge on the main window's taskbar button." }
code = ["crates/trek-app/src/system.rs"]

[[feature]]
id = "status-icon"
area = "App"
what = "Idle, working and needs-you icon with a small menu"
macos = "yes"
windows = "yes"
how = { macos = "Menu bar icon, with Show/Hide Background Use.", windows = "System tray icon drawn per taskbar theme and scale; left-click opens Trek. No Background Use item (see computer-use-background)." }
code = ["crates/trek-app/src/tray.rs"]

[[feature]]
id = "single-instance"
area = "App"
what = "A second launch hands its links and files to the running Trek"
macos = "yes"
windows = "yes"
how = { macos = "The system hands it over (open-URL and reopen events).", windows = "Trek's own named pipe and the data folder's lock." }
code = ["crates/trek-app/src/single_instance.rs"]

[[feature]]
id = "trek-links"
area = "App"
what = "trek:// links open in Trek"
macos = "yes"
windows = "partial"
how = { macos = "A URL type in the bundle.", windows = "Trek registers the HKCU key itself at launch." }
note = "The uninstaller leaves the trek:// and AppUserModelId keys behind: remove both in script/Uninstall-Trek.ps1."
code = ["crates/trek-app/src/winsys.rs"]

[[feature]]
id = "glass"
area = "App"
what = "Translucent window (Liquid glass)"
macos = "yes"
windows = "yes"
how = { macos = "Liquid Glass on macOS 26, blur before.", windows = "DWM backdrop, Windows 11 22H2 and later; off by default and not offered in onboarding." }
code = ["crates/trek-app/src/system.rs"]

[[feature]]
id = "open-in"
area = "App"
what = "Open a project in another app"
macos = "yes"
windows = "partial"
how = { macos = "Finder, Terminal, Ghostty, Zed, Cursor, VS Code, Xcode.", windows = "File Explorer, Windows Terminal, Zed, Cursor, VS Code." }
note = "JetBrains IDEs, Visual Studio and a PowerShell or Git Bash choice aren't offered yet."
code = ["crates/trek-core/src/open_in.rs"]

[[feature]]
id = "self-update"
area = "Install"
what = "Trek updates itself"
macos = "yes"
windows = "yes"
how = { macos = "The bundle swapped in one rename.", windows = "A staged folder swapped by trek-update.exe after quitting, with rollback, and guarded-folder (ransomware protection, Defender) handling." }
code = ["crates/trek-core/src/update.rs"]

[[feature]]
id = "native-builds"
area = "Install"
what = "A native build for each kind of processor"
macos = "yes"
windows = "partial"
how = { macos = "Apple silicon and Intel; an Intel build under Rosetta moves to the native one.", windows = "x64." }
note = "No ARM64 build: Windows on Arm runs the x64 one emulated. Needs an aarch64-pc-windows-msvc release job and manifest entry."
code = ["crates/trek-core/src/update.rs"]

[[feature]]
id = "signed-builds"
area = "Install"
what = "Releases the system trusts on first launch"
macos = "partial"
windows = "no"
note = "macOS builds are signed but not notarized; Windows builds are unsigned, so SmartScreen warns. Needs notarization and an Authenticode certificate (docs/RELEASING.md)."

