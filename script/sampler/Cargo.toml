# A sampling profiler for one thread of a Windows process (docs/PERF.md, "Where a frame's time
# goes"): its own workspace, outside Trek's, so the workspace's builds and CI never compile it.
#   cargo build --release --manifest-path script/sampler/Cargo.toml
[package]
name = "sampler"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Kernel",
] }
