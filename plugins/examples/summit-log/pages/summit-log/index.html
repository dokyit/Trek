<!doctype html>
<html lang="en">
<head>
  <title>Summit log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Summit log</h1>
    <p class="sub">Threads you finished, a cairn a day. Each stone is a thread you settled.</p>
  </header>

  <section class="tiles" aria-label="Totals">
    <div class="tile"><div class="n" id="today">–</div><div class="l">today</div></div>
    <div class="tile"><div class="n" id="week">–</div><div class="l">this week</div></div>
    <div class="tile"><div class="n" id="total">–</div><div class="l" id="total-label">in twelve weeks</div></div>
    <div class="tile quiet"><div class="n" id="now">–</div><div class="l">on the trail now</div></div>
  </section>

  <section class="card">
    <div class="bar">
      <div class="range" role="tablist" aria-label="Range">
        <button data-weeks="4" role="tab">4 weeks</button>
        <button data-weeks="12" role="tab">12 weeks</button>
      </div>
      <div class="best" id="best"></div>
    </div>
    <div class="cairns" id="cairns" aria-label="Threads finished per day"></div>
    <div class="months" id="months"></div>
    <p class="empty" id="empty" hidden>No summits yet. Settle a thread when it's done and its stone lands here.</p>
  </section>

  <p class="foot" id="foot"></p>
  <script src="app.js"></script>
</body>
</html>
