<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sounds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <label class="switch">
      <input type="checkbox" id="on">
      <span>Play sounds</span>
    </label>
    <section data-when="finish">
      <h2>When an agent finishes</h2>
      <div class="choices"></div>
    </section>
    <section data-when="needs">
      <h2>When an agent needs you</h2>
      <div class="choices"></div>
    </section>
    <p class="note">Trek's own alert sound plays too while Trek isn't in front: turn it off in Settings › Notifications if you'd rather hear only these.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
