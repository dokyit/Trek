id = "focus-timer"
name = "Focus walk"
version = "2.0.0"
description = "A focus timer on the composer: the hiker walks its edge while you work, then offers a break."
author = "Trek"
trek = ">=0.4.55"

# Trek's own component on the composer's edge. Before a walk it's one chip on the top edge (click
# its time for 15, 25, 45 or 60 minutes); during one the hiker walks the card's edge, and back at
# the chip it offers a break. A walk under way outlasts a restart. It reads nothing of yours.
[[slot]]
at = "composer.border"
ui = { type = "trek:focus-timer", minutes = 25, break = 5 }

[[command]]
id = "toggle"
title = "Focus walk: start, pause or carry on"
key = "cmd-alt-f"
action = "trek:focus-timer.toggle"

[[command]]
id = "break"
title = "Focus walk: take a break"
action = "trek:focus-timer.break"

[[command]]
id = "stop"
title = "Focus walk: stop and reset"
action = "trek:focus-timer.stop"
