name = "Terminal look"
description = "Monospace, square and flat, with the paint-blaze yellow that marks a trail."
mode = "dark"

[fonts]
ui = "mono"
conversation = "mono"

[shape]
corners = 0
density = "compact"

[lines]
pills = "like-corners"
borders = 1
shadows = 0

[motion]
style = "brisk"

# The user's words set flush with the answers, after a prompt mark, as a shell has them.
[messages]
user = "line"
user_mark = "›"

[composer]
prompt = "›"

# The hiker stays: a terminal on a trail. Its pack takes the blaze.
[hiker]
show = true
pack = "#E8C547"

[marks]
agents = "letter"

[dark]
accent = "#E8C547"
on_accent = "#17140A"
window = "#0D0E0C"
sidebar = "#0D0E0C"
surface = "#181A16"
raised = "#121410"
text = "#DAD7CA"
muted = "#878676"
border = "#2A2C26"

[dark.kit]
"title_bar.background" = "#0D0E0C"
"tab_bar.background" = "#0D0E0C"
"list.active.background" = "#20231C"
"selection.background" = "#E8C54738"

[light]
accent = "#7D6200"
on_accent = "#FFFFFF"
window = "#F5F3EA"
sidebar = "#F5F3EA"
surface = "#EAE7DA"
raised = "#FBFAF4"
text = "#1E1E1A"
muted = "#696858"
border = "#D9D5C4"

[light.kit]
"title_bar.background" = "#F5F3EA"
"tab_bar.background" = "#F5F3EA"
