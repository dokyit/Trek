id = "trail-board"
name = "Trail board"
version = "1.0.0"
description = "The thread list as a board: what needs you, what's on the trail, and what's reached the summit."
author = "Trek"
trek = ">=0.4.54"

# It lists your threads by state (their titles and agents, not what's in them) and opens the one
# you click.
permissions = ["threads:read", "threads:open"]

# In place of Trek's thread list. Settings › Plugins puts Trek's own back, and the board's last
# row shows it underneath.
[[replace]]
surface = "thread-list"
title = "Trail board"
ui = "ui/board.json"
