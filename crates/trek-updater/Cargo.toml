[package]
name = "trek-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Part of the Trek app (extracted from trek-app)."

[features]
# Items the UI tests reach for, on for `cargo test` via trek-app's dev-dep on itself.
test-support = []

[dependencies]
semver.workspace = true
tracing.workspace = true
trek-core.workspace = true
trek-shortcuts = { path = "../trek-shortcuts" }
trek-words = { path = "../trek-words" }

[dev-dependencies]
# Its tests flip trek-words' test-only platform pretend.
trek-words = { path = "../trek-words", features = ["test-support"] }
