[package]
name = "trek-passkeys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trek's own passkey authenticator for its Browser: WebAuthn's client rules, the authenticator's encodings, and where the keys are kept."

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
trek-core.workspace = true
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
# The keys of the stand-in authenticator (tests, the verify app) and of a Mac without a Secure
# Enclave, and the check every test makes of a signature.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# The Public Suffix List, compiled in: an rpId may be the page's registrable domain, never a
# public suffix (`co.uk`, `github.io`).
psl = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Secure Enclave (Security.framework, called directly) and Touch ID (LocalAuthentication).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSValue", "NSError", "NSObject"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAPublicDefines", "LAError"] }
