[package]
name = "trek-phone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A real iPhone from the Mac without Xcode: its screen over USB, taps and keys as a Bluetooth keyboard and mouse, and its apps and files over usbmuxd"

# The protocol (hid), paths (files) and the lease build everywhere. The device services (usbmuxd,
# lockdown, AFC, house_arrest, installation_proxy) and Trek Driver's client build on macOS and
# Windows, where usbmuxd is Apple Mobile Device Service (Apple Devices installs it). The helper
# that captures the screen and speaks Bluetooth, and iPhone Mirroring, are macOS-only.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
serde_json.workspace = true
# MIT; pure Rust over the usbmuxd socket, no libimobiledevice (LGPL) or pymobiledevice3 (GPL).
# `ring` matches the rustls provider the workspace already builds (reqwest's).
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd", "afc", "house_arrest", "installation_proxy"] }
plist = "1"
tokio = { workspace = true }
# "this Mac" or "this PC" in what the device services say went wrong.
trek-words = { path = "../trek-words" }

[target.'cfg(target_os = "macos")'.dependencies]
async-channel.workspace = true

[target.'cfg(windows)'.dependencies]
# Whether Apple Mobile Device Service is installed and running, when usbmuxd doesn't answer.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Services"] }
