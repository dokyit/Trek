[package]
name = "trek-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model Context Protocol server (stdio) giving coding agents computer use (macOS and Windows), iOS Simulator control, a video watcher and sub-agents"

[[bin]]
name = "trek-mcp"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
trek-ipc.workspace = true
base64 = "0.22"

[dev-dependencies]
# The orchestrate tests talk to a listener like Trek's (a socket, or a pipe on Windows).
trek-ipc = { workspace = true, features = ["server"] }
tokio.workspace = true
trek-test-fixtures.workspace = true

# Computer use runs on macOS and Windows, the iOS Simulator on macOS; `orchestrate` runs everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }
core-foundation = "0.10"
# `ForeignType::as_ptr`, to hand CGEvents to the window server's private calls (desktop/skylight.rs).
foreign-types = "0.5"
# `watch_video`'s transcripts: the Speech framework (`trek-mcp transcribe`); already in the lockfile
# via trek-app.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSArray", "NSEnumerator"] }
objc2-speech = "0.3"
block2 = "0.6"
# `trek-mcp phone-device`: the iPhone's apps and files over usbmuxd (no Xcode).
trek-phone = { path = "../trek-phone" }

[target.'cfg(windows)'.dependencies]
# Input (SendInput), the window list (EnumWindows, DWM), screenshots (GDI) and app launch (ShellExecuteW).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Screenshots out as PNG (macOS has `screencapture` for that); already in the lockfile via trek-app.
png = "0.18"
