[package]
name = "trek-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model Context Protocol server (stdio) giving coding agents macOS computer use, iOS Simulator control and sub-agents"

[[bin]]
name = "trek-mcp"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
trek-ipc.workspace = true
base64 = "0.22"

[dev-dependencies]
# The orchestrate tests talk to a listener like Trek's (a socket, or a pipe on Windows).
trek-ipc = { workspace = true, features = ["server"] }
tokio.workspace = true

# Computer use and the iOS Simulator are macOS-only tool families; `orchestrate` runs everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
