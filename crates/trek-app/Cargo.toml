[package]
name = "trek-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trek — every agent, one trail."

[[bin]]
name = "trek"
path = "src/main.rs"

[features]
# Design review without Screen Recording: the window draws its frames to PNGs (src/shots.rs).
shots = ["gpui-kit/test-support"]

[dependencies]
tokio.workspace = true
trek-core.workspace = true
trek-agents.workspace = true
trek-ipc = { workspace = true, features = ["server"] }
trek-remote = { path = "../trek-remote" }
reqwest.workspace = true
# The pairing QR code in Settings › Phone, drawn as squares.
qrcode = { version = "0.14", default-features = false }
gpui-kit.workspace = true
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed = "8"
tray-icon = "0.26"
png = "0.18"
# Same version GPUI decodes clipboard images with; converts TIFF/BMP pastes to PNG.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp", "ico", "pnm"] }
portable-pty = "0.9"
vt100 = "0.16"
gpui-wry = "=0.7.0"
wry = { version = "0.53.3", package = "lb-wry", features = ["devtools"] }
raw-window-handle = "0.6.2"
# flock on the data folder (one Trek per folder closes the turns it left open).
libc = "0.2"
lsp-types = "0.97"
# The editor's Explorer: folders read as git would list them (.gitignore respected), and kept
# up to date by FSEvents, as are open files an agent edits.
ignore = "0.4"
notify = "7"
ropey = "2.0.0-beta.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions tray-icon already pulls in; used for the Dock badge.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSFileManager", "NSURL", "NSError", "NSBundle", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSDockTile", "NSWorkspace", "NSAccessibility", "NSImage"] }
# Dictation: AVAudioRecorder takes the mic, Speech transcribes the take (src/dictate.rs).
objc2-avf-audio = "0.3"
objc2-speech = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# LockFileEx on the data folder, a job object per language server, the registry for the OS name,
# the exe's icon resources for the windows' icons.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The adapters and their addresses for the phone pairing screen (getifaddrs has no Windows twin).
if-addrs = "0.13"
# The taskbar button's overlay badge (ITaskbarList3); the version GPUI's Windows platform uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
# The app icon in trek.exe (build.rs), through the Windows SDK's rc.exe.
embed-resource = "3"

[dev-dependencies]
# Headless UI tests (src/tests): GPUI's test platform, plus CoreText from the macOS platform so
# text lays out as it does in the app.
gpui-kit = { workspace = true, features = ["test-support"] }
ctor = "1"
trek-test-fixtures.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.7" }

[target.'cfg(windows)'.dev-dependencies]
# The Windows twin of gpui_macos: DirectWrite, so the tests' text lays out as in the app.
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.7" }
