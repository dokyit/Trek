[package]
name = "trek-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trek — every agent, one trail."

[[bin]]
name = "trek"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
trek-core.workspace = true
trek-agents.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
serde_json.workspace = true
semver.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed = "8"
tray-icon = "0.26"
png = "0.18"
# Same version GPUI decodes clipboard images with; converts TIFF/BMP pastes to PNG.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp", "ico", "pnm"] }
portable-pty = "0.9"
vt100 = "0.16"
gpui-wry = "=0.7.0"
wry = { version = "0.53.3", package = "lb-wry", features = ["devtools"] }
raw-window-handle = "0.6.2"
# flock on the data folder (one Trek per folder closes the turns it left open).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions tray-icon already pulls in; used for the Dock badge.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSDockTile"] }

[dev-dependencies]
# Headless UI tests (src/tests): GPUI's test platform, plus CoreText from the macOS platform so
# text lays out as it does in the app.
gpui-kit = { workspace = true, features = ["test-support"] }
ctor = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.7" }
