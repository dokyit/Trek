[package]
name = "trek-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trek — every agent, one trail."

[[bin]]
name = "trek"
path = "src/main.rs"

[features]
# Design review without Screen Recording: the window draws its frames to PNGs (src/shots.rs).
shots = ["gpui-kit/test-support", "trek-motion/shots", "trek-dictate/shots", "trek-perf/shots"]
# What tests/ can reach from outside the crate (render counts, test-only view helpers). The
# dev-dependency on trek-app itself turns it on for `cargo test`; a plain build leaves it off.
test-support = ["gpui-kit/test-support", "dep:trek-test-fixtures", "trek-motion/test-support", "trek-shortcuts/test-support", "trek-screenclip/test-support", "trek-ipc-ui/test-support", "trek-words/test-support", "trek-window-place/test-support", "trek-logging/test-support", "trek-mascot/test-support", "trek-languages/test-support", "trek-time/test-support", "trek-mentions/test-support", "trek-perf/test-support", "trek-winlook/test-support", "trek-palette/test-support", "trek-integrations/test-support", "trek-brand/test-support", "trek-job/test-support", "trek-format/test-support", "trek-dictate/test-support", "trek-updater/test-support", "trek-line-breakdown/test-support", "trek-assets/test-support"]

[dependencies]
tokio.workspace = true
trek-core.workspace = true
trek-math = { path = "../trek-math" }
trek-motion = { path = "../trek-motion" }
trek-shortcuts = { path = "../trek-shortcuts" }
trek-screenclip = { path = "../trek-screenclip" }
trek-ipc-ui = { path = "../trek-ipc-ui" }
trek-words = { path = "../trek-words" }
trek-window-place = { path = "../trek-window-place" }
trek-logging = { path = "../trek-logging" }
trek-mascot = { path = "../trek-mascot" }
trek-languages = { path = "../trek-languages" }
trek-time = { path = "../trek-time" }
trek-mentions = { path = "../trek-mentions" }
trek-perf = { path = "../trek-perf" }
trek-winlook = { path = "../trek-winlook" }
trek-palette = { path = "../trek-palette" }
trek-integrations = { path = "../trek-integrations" }
trek-brand = { path = "../trek-brand" }
trek-job = { path = "../trek-job" }
trek-format = { path = "../trek-format" }
trek-dictate = { path = "../trek-dictate" }
trek-updater = { path = "../trek-updater" }
trek-line-breakdown = { path = "../trek-line-breakdown" }
trek-assets = { path = "../trek-assets" }
trek-agents.workspace = true
trek-ipc = { workspace = true, features = ["server"] }
trek-remote = { path = "../trek-remote" }
reqwest.workspace = true
# The pairing QR code in Settings › Phone, drawn as squares.
qrcode = { version = "0.14", default-features = false }
gpui-kit.workspace = true
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
# Interactive artifacts: each web view's secret (`artifact::nonce`).
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
# Browser extensions: an unpacked extension's id from its manifest key or folder (as Chromium makes it).
base64 = "0.22"
sha2 = "0.10"
semver.workspace = true
# The Share sheet: its HTML page's Markdown (the version gpui-component uses), and hiding paths and
# keys in a shared copy.
markdown = "1"
regex = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
# GPUI logs through `log`; `logging.rs` hands its records to tracing with where they came from.
log = { version = "0.4", features = ["std"] }
tracing-log = "0.2"
rust-embed = "8"
tray-icon = "0.26"
png = "0.18"
# Same version GPUI decodes clipboard images with; converts TIFF/BMP pastes to PNG.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp", "ico", "pnm", "jpeg", "gif", "webp"] }
# Draws added agents' and projects' SVG icons for the phone. The version GPUI draws SVGs with.
resvg = { version = "0.46", default-features = false }
portable-pty = "0.9"
vt100 = "0.16"
gpui-wry = "=0.7.0"
# `transparent`: an interactive artifact's page shows the card through it (macOS).
wry = { version = "0.53.3", package = "lb-wry", features = ["devtools", "transparent"] }
raw-window-handle = "0.6.2"
# flock on the data folder (one Trek per folder closes the turns it left open).
libc = "0.2"
lsp-types = "0.97"
# The editor's Explorer: folders read as git would list them (.gitignore respected), and kept
# up to date by FSEvents, as are open files an agent edits.
ignore = "0.4"
notify = "7"
ropey = "2.0.0-beta.1"
# Fixture binaries tests spawn as fake agents/formatters (src/format.rs, src/lsp_client.rs,
# tests/): optional so plain builds don't compile it; test-support enables it.
trek-test-fixtures = { workspace = true, optional = true }
# gpui-kit 0.7 compiles these grammars in without their highlight queries (they parse and colour
# nothing); src/languages.rs registers the queries the grammar crates carry. The versions
# gpui-component already uses.
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-swift = "0.7.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The iPhone tool: the real phone's screen, Bluetooth input, apps and files (no Xcode).
trek-phone = { path = "../trek-phone" }
# Frames of the window background computer use works in, for its picture-in-picture window.
core-graphics = { version = "0.24", features = ["highsierra"] }
# Same versions tray-icon already pulls in; used for the Dock badge.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSFileManager", "NSURL", "NSError", "NSBundle", "NSData", "NSGeometry", "NSArray", "NSDictionary", "NSValue", "NSSet", "NSDate", "NSEnumerator", "NSURLRequest", "NSUUID", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSDockTile", "NSWorkspace", "NSAccessibility", "NSImage", "NSView", "NSWindow", "NSAppearance", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSPasteboard", "NSPopover", "NSGraphics", "objc2-core-foundation"] }
# Interactive artifacts: a snapshot of the page stands in while it's covered (`takeSnapshot`).
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKSnapshotConfiguration", "WKWebViewConfiguration", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore", "objc2-core-foundation", "WKWebExtension", "WKWebExtensionAction", "WKWebExtensionContext", "WKWebExtensionController", "WKWebExtensionControllerConfiguration", "WKWebExtensionControllerDelegate", "WKWebExtensionMatchPattern", "WKWebExtensionPermission", "WKWebExtensionTab", "WKWebExtensionTabConfiguration", "WKWebExtensionWindow", "WKWebExtensionWindowConfiguration", "WKWebExtensionDataRecord", "WKWebExtensionDataType", "WKNavigation"] }
# Dictation: AVAudioRecorder takes the mic, Speech transcribes the take (src/dictate.rs).
objc2-avf-audio = "0.3"
objc2-speech = "0.3"
block2 = "0.6"
# Onboarding's permissions step: whether Trek may post notifications, and the prompt that asks
# (the version GPUI's macOS platform posts them with).
objc2-user-notifications = "0.3"

[target.'cfg(windows)'.dependencies]
# LockFileEx on the data folder, a job object per language server, the registry for the OS name,
# the session's idle time and lock state for push notifications' away-detection, and the exe's
# icon resources for the windows' icons, at the size their display's scale wants (HiDpi).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The adapters and their addresses for the phone pairing screen (getifaddrs has no Windows twin).
if-addrs = "0.13"
# Shortcut files (IShellLinkW) pointed at a Trek that moved (src/shortcuts.rs). The taskbar button's overlay badge (ITaskbarList3), and snapshots: Snipping Tool's overlay (ShellExecuteW)
# and the clipboard it leaves the image on. The version GPUI's Windows platform uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The browser panel's WebView2 calls wry doesn't wrap (history, error pages, CapturePreview): the
# webview2-com and windows versions wry 0.53 is built on, so its ICoreWebView2 is the same type.
webview2-com = "0.38"
windows-61 = { package = "windows", version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
# The app icon in trek.exe (build.rs), through the Windows SDK's rc.exe.
embed-resource = "3"

[dev-dependencies]
# Headless UI tests (tests/): GPUI's test platform, plus CoreText from the macOS platform so
# text lays out as it does in the app.
gpui-kit = { workspace = true, features = ["test-support"] }
ctor = "1"
# Integration tests link the library with its test-only surface (test_support, the views' test
# hooks) on: this dev-dependency on the crate itself is what enables the feature.
trek-app = { path = ".", features = ["test-support"] }
# Extension packages for the Browser's unpacking tests (trek-core's version: nothing new to build).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.7" }

[target.'cfg(windows)'.dev-dependencies]
# The Windows twin of gpui_macos: DirectWrite, so the tests' text lays out as in the app.
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.7" }
