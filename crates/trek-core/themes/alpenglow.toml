# Alpenglow: Trek over the mountains at first light. Bierstadt's Sunrise on the Matterhorn lies
# across the whole chat under a scrim that keeps the text readable, with dusk-blue chrome, a warm
# peach accent and soft corners.
name = "Alpenglow"
description = "Sunrise on the Matterhorn behind the chat, dusk-blue chrome, a peach accent."
mode = "dark"

[fonts]
ui = "sans"
conversation = "sans"

[shape]
corners = 1.5
density = "regular"

[background]
art = "builtin:paintings/matterhorn"
placement = "chat"
dim = 0

[motion]
style = "calm"

[dark]
accent = "#FF9E6B"
on_accent = "#1E0C03"
window = "#0C0F1C"
sidebar = "#0F1324"
surface = "#191E34"
raised = "#151A2D"
text = "#ECEAF3"
muted = "#9799B3"
border = "#272D48"

[light]
accent = "#B24A17"
on_accent = "#FFFFFF"
window = "#FBF6F0"
sidebar = "#F5EEE6"
surface = "#EFE6DB"
raised = "#FFFBF6"
text = "#2A2320"
muted = "#7A6D63"
border = "#E3D7C8"
