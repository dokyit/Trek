[package]
name = "trek-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
directories.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
semver.workspace = true
walkdir.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
sha2 = "0.10"
hex = "0.4"
minisign-verify = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# renamex_np(RENAME_SWAP): swap the app bundle for its update in one step.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Process ids, start times and trees, for `procs`.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading"] }
# The user and machine PATH, for a GUI launch that has an older one.
winreg = "0.55"
