<!doctype html><html><head><meta charset="utf-8"><title>Study</title>
<link rel="stylesheet" href="/_trek/katex/katex.min.css">
<script defer src="/_trek/katex/katex.min.js"></script>
<script defer src="/_trek/katex/auto-render.min.js"></script>
<style>
:root{--tint:color-mix(in srgb,var(--trek-accent) 10%,transparent);--line:var(--trek-border);--ease:cubic-bezier(.23,1,.32,1);--t:.15s var(--ease);--wash:color-mix(in srgb,var(--trek-fg) 6%,transparent)}
body{margin:0;padding:14px 16px 16px;background:transparent;color:var(--trek-fg);font:14px/1.5 var(--trek-font,system-ui)}
#card{display:flex;flex-direction:column;gap:14px}
.where{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--trek-muted)}
.where .bar{flex:1;max-width:160px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.where .bar i{display:block;height:100%;background:var(--trek-accent);border-radius:2px}
.q{font-size:16px;font-weight:600;line-height:1.4;text-wrap:pretty}
.q p,.q ul,.q ol{margin:0}.q>*+*{margin-top:8px}.q ul,.q ol{padding-left:20px}
code{font-family:var(--trek-mono,ui-monospace,monospace);font-size:.92em}
pre{margin:0;padding:8px 12px;border-radius:8px;background:var(--wash);overflow-x:auto;font:400 13px/1.45 var(--trek-mono,ui-monospace,monospace)}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:-2px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:border-color var(--t),background-color var(--t)}
.opt:hover{border-color:color-mix(in srgb,var(--trek-fg) 28%,transparent)}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--trek-accent);background:var(--tint)}
.key{flex:none;width:20px;height:20px;margin-top:1px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--trek-muted);transition:background-color var(--t),color var(--t),border-color var(--t)}
.opt.on .key{background:var(--trek-accent);border-color:var(--trek-accent);color:#1c120c}
.label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--trek-muted);margin-bottom:6px}
.label b{font-weight:500;color:var(--trek-fg)}
.box{position:relative}
textarea{display:block;width:100%;box-sizing:border-box;min-height:64px;resize:vertical;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit;line-height:1.5;transition:border-color var(--t)}
.talk textarea{padding-right:44px}
textarea::placeholder{color:var(--trek-muted)}
textarea:focus{outline:none;border-color:var(--trek-accent)}
.mic{position:absolute;right:7px;bottom:7px;width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--trek-muted);cursor:pointer;transition:background-color var(--t),color var(--t)}
.mic:hover{color:var(--trek-fg);background:var(--wash)}
.mic.on{color:var(--trek-bg);background:var(--trek-accent)}
.mic.on svg{animation:beat 1.2s var(--ease) infinite}
.mic.wait{opacity:.6;cursor:progress}
.mic:disabled{display:none}
.listening textarea{border-color:var(--trek-accent)}
.sure{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--wash);width:max-content;max-width:100%;flex-wrap:wrap}
.sure button{border:0;background:transparent;color:var(--trek-muted);padding:4px 10px;border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer;transition:background-color var(--t),color var(--t)}
.sure button:hover{color:var(--trek-fg)}
.sure button.on{background:color-mix(in srgb,var(--trek-fg) 12%,transparent);color:var(--trek-fg);font-weight:500}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:2px}
.foot .note{margin-right:auto;font-size:12px;color:var(--trek-muted)}
.btn{font:inherit;font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;transition:transform .12s var(--ease),opacity var(--t)}
.btn:hover{background:var(--wash)}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--trek-fg);border-color:var(--trek-fg);color:var(--trek-bg);font-weight:500}
.btn:disabled{opacity:.4;cursor:default;transform:none}
kbd{font:inherit;font-size:11px;opacity:.6;margin-left:6px}
.sent{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--trek-muted);animation:in .18s var(--ease)}
.sent svg{flex:none;color:var(--trek-positive,var(--trek-accent))}
.done .opt,.done textarea,.done .sure button{cursor:default}
.done .opt:disabled,.done .sure button:disabled{opacity:1}
.done .opt:not(.on){opacity:.55}
.done .opt.on{opacity:1}
.done .sure button:not(.on){opacity:.55}
.done textarea{resize:none}
[hidden]{display:none!important}
.kept{padding:9px 12px;border:1px solid var(--line);border-radius:10px;line-height:1.5;overflow-wrap:anywhere}
.kept p,.kept ul,.kept ol{margin:0}
.kept>*+*{margin-top:6px}
.kept ul,.kept ol{padding-left:20px}
.kept code{padding:1px 4px;border-radius:4px;background:var(--wash)}
.kept .katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}
@keyframes in{from{opacity:0;transform:translateY(2px)}}
@keyframes beat{50%{transform:scale(.86)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="card"></div>
<script>
const DATA = __DATA__;
const LABEL = {question: "Question", predict: "Predict", check: "Check", problem: "Problem"}[DATA.kind] || "Question";
const problem = DATA.kind === "problem", choice = !problem && DATA.options.length > 0;
const SURE = [["Guessing", 20], ["Unsure", 45], ["Fairly sure", 70], ["Sure", 95]];
const HEAD = [LABEL, DATA.step].filter(Boolean).join(" · ") + (DATA.targets.length ? " [" + DATA.targets.join(", ") + "]" : "");
const mac = /Mac|iPhone|iPad/.test(navigator.platform);
const el = (t, c, s) => { const e = document.createElement(t); if (c) e.className = c; if (s != null) e.textContent = s; return e; };
const card = document.getElementById("card");
let pick = null, sure = null, closed = false, sends = 0;

// Where they are: "Step 3 of 8 · Scaled scores" draws 3 of 8 as a bar.
if (DATA.step) {
  const w = el("div", "where"), m = DATA.step.match(/(\d+)\s*of\s*(\d+)/i);
  w.append(el("span", null, DATA.step));
  if (m && +m[2] > 0) { const b = el("span", "bar"), i = el("i"); i.style.width = Math.min(100, 100 * m[1] / m[2]) + "%"; b.append(i); w.append(b); }
  card.append(w);
}
// The question, and what they wrote as it reads once sent: basic Markdown (paragraphs, lists,
// **bold**, *italic*, `code`, fenced code) built as elements, never as HTML, with the maths left
// as text for KaTeX to set. The maths is set aside first, so a `*` or `_` in it is never taken
// for emphasis.
const SPAN = /\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+?\$/g;
const INLINE = /(`[^`\n]+`)|\*\*([^*\n]+?)\*\*|\*([^*\s][^*\n]*?)\*|(?<![\w\\])_([^_\n]+?)_(?!\w)|\u0000(\d+)\u0000/g;
function inline(parent, s, maths) {
  const re = new RegExp(INLINE.source, "g");
  let at = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > at) parent.append(document.createTextNode(s.slice(at, m.index)));
    if (m[1]) parent.append(el("code", null, m[1].slice(1, -1)));
    else if (m[2] != null) { const b = el("strong"); inline(b, m[2], maths); parent.append(b); }
    else if (m[3] != null || m[4] != null) { const i = el("em"); inline(i, m[3] != null ? m[3] : m[4], maths); parent.append(i); }
    else parent.append(document.createTextNode(maths[+m[5]]));
    at = m.index + m[0].length;
  }
  if (at < s.length) parent.append(document.createTextNode(s.slice(at)));
}
function md(text, cls) {
  const maths = [], box = el("div", cls);
  const lines = text.replace(SPAN, x => "\u0000" + (maths.push(x) - 1) + "\u0000").split("\n");
  let list = null, para = null, code = null;
  for (const line of lines) {
    if (/^\s*(```|~~~)/.test(line)) {
      if (code) code = null; else { const pre = el("pre"); code = el("code"); pre.append(code); box.append(pre); list = para = null; }
      continue;
    }
    if (code) { code.textContent += (code.textContent ? "\n" : "") + line.replace(/\u0000(\d+)\u0000/g, (_, n) => maths[+n]); continue; }
    const item = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/);
    if (item) {
      const tag = /\d/.test(item[1]) ? "ol" : "ul";
      if (!list || list.tag !== tag) { list = el(tag); list.tag = tag; box.append(list); }
      const li = el("li"); inline(li, item[2], maths); list.append(li); para = null;
    } else if (!line.trim()) list = para = null;
    else {
      list = null;
      if (para) para.append(el("br")); else { para = el("p"); box.append(para); }
      inline(para, line, maths);
    }
  }
  return box;
}
const kept = text => md(text, "kept");
// A line of text with its Markdown and maths set, into `parent`.
function line(parent, text) { const maths = []; inline(parent, text.replace(SPAN, x => "\u0000" + (maths.push(x) - 1) + "\u0000"), maths); return parent; }


card.append(md(DATA.prompt, "q"));

const rows = [];
if (choice) {
  const box = el("div", "opts");
  DATA.options.forEach((o, i) => {
    const r = el("button", "opt");
    r.type = "button";
    r.append(el("span", "key", String.fromCharCode(65 + i)), line(el("span"), o));
    r.onclick = () => choose(i);
    rows.push(r); box.append(r);
  });
  card.append(box);
}
function choose(i) { if (closed || i < 0 || i >= rows.length) return; pick = i; rows.forEach((x, j) => x.classList.toggle("on", j === i)); sync(); keepSoon(); }

const field = el("div"), label = el("div", "label"), wrap = el("div", "box"), work = el("textarea");
label.append(el("b", null, problem ? "Your working" : DATA.kind === "predict" ? "Your prediction" : "Your thinking"),
  el("span", null, problem ? "send it in pieces as you go" : choice ? "optional · messy is fine" : "messy is fine"));
work.placeholder = problem ? "What you notice, what you try, where you're stuck…"
  : DATA.kind === "predict" ? "What do you expect the next move is, and why?"
  : choice ? "Why this answer? What made you unsure?" : "Think out loud: what comes to mind, what you're unsure of.";
wrap.append(work); field.append(label, wrap); card.append(field);

// Say it instead: Trek's own dictation (the composer's), into the box. What's heard so far shows
// in the box as it comes and is revised; the mic again (or sending) ends the take.
const T = window.trek || {};
let mic = null, before = null, taking = false;
const joined = (base, said) => { said = (said || "").trim(); return !said ? base : base + (base && !/\s$/.test(base) ? " " : "") + said; };
if (T.canDictate && typeof T.dictate === "function") {
  field.classList.add("talk");
  mic = el("button", "mic"); mic.type = "button"; mic.title = "Dictate"; mic.setAttribute("aria-label", "Dictate");
  mic.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>';
  mic.onclick = () => { if (!closed && !T.dictate(!taking)) note.textContent = "Couldn't start dictation: click the mic again."; };
  wrap.append(mic);
  window.addEventListener("trekdictation", e => {
    const d = (e && e.detail) || {};
    if (closed) return;
    if (d.state === "asking" || d.state === "listening" || d.state === "finishing") {
      if (before === null) before = work.value;
      taking = d.state !== "finishing";
      if (d.state !== "asking") work.value = joined(before, d.text);
      mic.classList.toggle("on", d.state === "listening");
      mic.classList.toggle("wait", d.state !== "listening");
      mic.title = d.state === "listening" ? "Stop dictating" : "Dictate";
      field.classList.toggle("listening", d.state !== "asking");
    } else {
      if (before !== null) work.value = d.state === "done" ? joined(before, d.text) : before;
      before = null; taking = false;
      mic.classList.remove("on", "wait"); mic.title = "Dictate"; field.classList.remove("listening");
      if (d.error) note.textContent = d.error;
      keepSoon();
    }
    sync();
  });
}

const sureRow = el("div", "sure");
if (!problem) {
  const f = el("div"), l = el("div", "label");
  l.append(el("b", null, "How sure are you?"));
  SURE.forEach(([name], i) => {
    const b = el("button", null, name); b.type = "button";
    b.onclick = () => { if (!closed) setSure(i); };
    sureRow.append(b);
  });
  f.append(l, sureRow); card.append(f);
}
function setSure(i) { sure = i; [...sureRow.children].forEach((x, j) => x.classList.toggle("on", j === i)); keepSoon(); }

const foot = el("div", "foot"), note = el("span", "note");
foot.append(note); card.append(foot);
const button = (text, go, fn) => { const b = el("button", "btn" + (go ? " go" : ""), text); b.type = "button"; b.onclick = fn; foot.append(b); return b; };

// Maths ($…$, $$…$$, \(…\), \[…\]) typeset by KaTeX once it has loaded; the page's load
// typesets the whole card, and anything added after that is typeset as it's added.
const MATH = {delimiters: [{left: "$$", right: "$$", display: true}, {left: "\\[", right: "\\]", display: true},
  {left: "$", right: "$", display: false}, {left: "\\(", right: "\\)", display: false}], throwOnError: false};
const typeset = n => { if (window.renderMathInElement) renderMathInElement(n, MATH); };

// Answered: what they chose, how sure and what they wrote stay, with what was sent. What they
// wrote is set as it reads (Markdown and maths typeset), no longer a box to type in.
function close(lines) {
  closed = true; card.classList.add("done"); work.readOnly = true;
  if (typeof T.keep === "function") T.keep("");
  if (work.value.trim()) { const k = kept(work.value); work.hidden = true; wrap.append(k); typeset(k); }
  else field.hidden = true;
  if (mic) { if (taking) T.dictate(false); mic.disabled = true; }
  card.querySelectorAll("button").forEach(b => b.disabled = true);
  const s = el("div", "sent");
  s.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>';
  s.append(el("span", null, "Sent · " + lines.map(l => l.replace(/^[^:]+: /, "")).join(" · ")));
  foot.replaceWith(s); typeset(s);
}
function send(lines, done) {
  const text = [HEAD, ...lines, "Working: " + (work.value.trim() || "(none)")].join("\n");
  if (!T.send || !T.send(text)) { note.textContent = "Couldn't send: copy your working into the composer."; return; }
  if (done) { close(lines); return; }
  sends++; work.value = ""; before = taking ? "" : null; keepSoon();
  note.textContent = sends === 1 ? "Sent · keep going" : "Sent " + sends + " times · keep going"; sync();
}
const sureLine = () => "Confidence: " + (sure === null ? "not given" : SURE[sure][0] + " (" + SURE[sure][1] + "%)");

let main;
if (problem) {
  button("Hint", false, () => send(["Asking for: a hint"], false));
  button("Send working", false, () => send(["Status: still working"], false));
  main = button("Solved", true, () => send(["Status: I think I've solved it"], true));
} else {
  button("I don't know", false, () => send(["Answer: I don't know"], true));
  main = button(choice ? "Answer" : "Send", true, () => send([
    choice ? "Answer: " + String.fromCharCode(65 + pick) + ". " + DATA.options[pick] : "Answer: (in my thinking)", sureLine()], true));
}
main.append(el("kbd", null, mac ? "⌘↩" : "Ctrl+Enter"));
function sync() { if (!closed) main.disabled = choice ? pick === null : !problem && !work.value.trim(); }
// What's chosen and typed so far is handed to Trek as it changes (`trek.keep`), and taken back
// when the card is drawn again before it was answered (scrolled away and back, another thread
// looked at): Trek lets a card's page go while it's far off screen.
let keeping = null;
const draft = () => JSON.stringify({pick, sure, work: taking && before !== null ? before : work.value});
const keepNow = () => { keeping = null; if (!closed && typeof T.keep === "function") T.keep(pick === null && sure === null && !work.value ? "" : draft()); };
const keepSoon = () => { if (keeping === null) keeping = setTimeout(keepNow, 250); };
work.oninput = () => { sync(); keepSoon(); }; sync();

// Already answered (the card drawn again later): Trek hands the page what the learner sent
// after it, and the card shows that answer as it was sent.
(function restore() {
  const sent = (Array.isArray(T.replies) ? T.replies : []).filter(r => typeof r === "string" && r.split("\n")[0] === HEAD);
  const last = sent.find(r => /\nStatus: I think I've solved it\n/.test(r) || /\nAnswer: /.test(r)) || null;
  if (!last) {
    if (sent.length) { sends = sent.length; note.textContent = "Sent " + (sends === 1 ? "" : sends + " times ") + "· keep going"; }
    // Not answered yet: what was chosen and typed before the card was let go.
    let d = null;
    try { d = typeof T.kept === "string" && T.kept ? JSON.parse(T.kept) : null; } catch (_) {}
    if (d && typeof d === "object") {
      if (choice && Number.isInteger(d.pick)) choose(d.pick);
      if (!problem && Number.isInteger(d.sure) && d.sure >= 0 && d.sure < SURE.length) setSure(d.sure);
      if (typeof d.work === "string") work.value = d.work;
      sync();
    }
    return;
  }
  const at = last.indexOf("\nWorking: "), body = at < 0 ? last : last.slice(0, at);
  const said = at < 0 ? "" : last.slice(at + 10);
  const lines = body.split("\n").slice(1);
  for (const l of lines) {
    let m;
    if ((m = l.match(/^Answer: ([A-Z])\. /)) && choice) choose(m[1].charCodeAt(0) - 65);
    if ((m = l.match(/^Confidence: (.+) \(\d+%\)$/))) { const i = SURE.findIndex(([n]) => n === m[1]); if (i >= 0) setSure(i); }
  }
  work.value = said === "(none)" ? "" : said;
  close(lines);
})();

// A–D or 1–4 pick an option (outside the text box); ⌘↩ or Ctrl+Enter sends.
document.addEventListener("keydown", e => {
  if (closed) return;
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { if (!main.disabled) { e.preventDefault(); main.click(); } return; }
  if (!choice || e.target === work || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase(), i = /^[1-9]$/.test(k) ? +k - 1 : k.length === 1 ? k.charCodeAt(0) - 65 : -1;
  if (i >= 0 && i < rows.length) { e.preventDefault(); choose(i); rows[i].focus(); }
});
window.addEventListener("load", () => typeset(card));
</script></body></html>
