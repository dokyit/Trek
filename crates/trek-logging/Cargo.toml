[package]
name = "trek-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Part of the Trek app (extracted from trek-app)."

[features]
# Items the UI tests reach for, on for `cargo test` via trek-app's dev-dep on itself.
test-support = ["dep:gpui_windows"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
log = { version = "0.4", features = ["std"] }
tracing.workspace = true
tracing-log = "0.2"
tracing-subscriber.workspace = true
trek-core.workspace = true
wry = { version = "0.53.3", package = "lb-wry", features = ["devtools", "transparent"] }

[target.'cfg(windows)'.dependencies]
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.7", optional = true }
