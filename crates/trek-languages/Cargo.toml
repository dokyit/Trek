[package]
name = "trek-languages"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Part of the Trek app (extracted from trek-app)."

[features]
# Items the UI tests reach for, on for `cargo test` via trek-app's dev-dep on itself.
test-support = ["gpui-kit/test-support"]

[dependencies]
gpui-kit.workspace = true
ropey = "2.0.0-beta.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-swift = "0.7.3"
