[package]
name = "trek-banner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Part of the Trek app: the Mac's notification center, asked directly."

[dependencies]
serde_json.workspace = true
trek-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSBundle", "NSArray"] }
objc2-user-notifications = "0.3"
block2 = "0.6"
