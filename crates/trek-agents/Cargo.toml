[package]
name = "trek-agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
trek-core.workspace = true
trek-ipc.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
async-channel.workspace = true
reqwest.workspace = true
tracing.workspace = true
chrono.workspace = true
base64 = "0.22"
# Devin shows its quota only in its terminal UI (`status::devin_status`).
portable-pty = "0.9"
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
# Process groups and their signals (`spawn_group`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job objects, in place of process groups (`spawn_group`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Isolates the test binary before any test runs (see `tests::isolate_process` in lib.rs).
ctor = "1"
