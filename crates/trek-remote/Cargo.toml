[package]
name = "trek-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trek's WebSocket server for the iPhone companion app: pairing, device tokens and protocol v1"

[dependencies]
# The pairing key and the paired phones' list: the user's alone on both platforms.
trek-private.workspace = true
tokio.workspace = true
futures-util = "0.3"
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio-tungstenite = "0.30"
# To make an IPv6 listener take IPv4 too (Windows makes it IPv6-only unless asked).
socket2 = "0.6"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
subtle = "2.6"
# TLS with a self-signed certificate the phone pins (src/tls.rs); ring, as reqwest already uses.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }

[target.'cfg(windows)'.dependencies]
# The TLS key file's ACL (src/tls.rs): the user's alone, as 0600 makes it on a Mac.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tracing-subscriber.workspace = true
