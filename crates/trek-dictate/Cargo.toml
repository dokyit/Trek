[package]
name = "trek-dictate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Part of the Trek app (extracted from trek-app)."

[features]
shots = []
# Items the UI tests reach for, on for `cargo test` via trek-app's dev-dep on itself.
test-support = []

[dependencies]
async-channel.workspace = true
trek-words = { path = "../trek-words" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-avf-audio = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSFileManager", "NSURL", "NSError", "NSBundle", "NSData", "NSGeometry", "objc2-core-foundation"] }
objc2-speech = "0.3"

# Windows' own speech recognition (Windows.Media.SpeechRecognition) for a packaged Trek, and the
# capture endpoint's meter for its waveform; the microphone through WASAPI for Trek's on-device
# engine, and its speech model downloaded over WinHTTP (the system's proxy and certificates); the
# registry for what Settings has turned off.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Media_SpeechRecognition",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"
# The downloaded speech model's checksum.
sha2 = "0.10"
tracing.workspace = true

# On-device speech recognition for a Trek without package identity, which Windows' recognizer
# never answers: whisper.cpp, built from source by CMake through Trek's copy of whisper-rs-sys
# (vendor/whisper-rs-sys: built for the AVX2 baseline, so a release runs on any x86-64 PC with
# AVX2, and with the static runtime). Its bindings are generated by bindgen, which needs libclang:
# CI's runners have LLVM; elsewhere install it, or point LIBCLANG_PATH at a folder with
# libclang.dll.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
