name: Feature request
description: An idea that would make Trek better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Sketches and screenshots welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agents and models
        - Inbox and threads
        - Review and git
        - Tools (terminal, browser, editor, simulator)
        - Phone and other machines
        - Something else
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
