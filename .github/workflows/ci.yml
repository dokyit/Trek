name: CI

on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds don't help a fresh runner and bloat the cache.
  CARGO_INCREMENTAL: 0
  # The build stays free of warnings: one fails it. (Crates from crates.io have their lints
  # capped by Cargo; this covers the workspace and vendor/.)
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the whole workspace; saved from main so pull requests reuse it.
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Keep the workspace crates' own artifacts too, so a push that touches one crate does
          # not rebuild the others (trek-core, trek-agents, trek-remote take minutes each).
          cache-workspace-crates: true

      # gpui compiles its Metal shaders at build time with `xcrun metal`. Since Xcode 26 the Metal
      # toolchain is a separate component that an image may not have; `xcrun -f metal` finds a
      # stub either way, so run the compiler to tell.
      - name: Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Scripts parse
        run: for f in script/*.sh script/lib/*.sh; do zsh -n "$f"; done

      # The release notes step (script/lib/notes.sh) against its fixtures: every release body
      # carries the install block exactly once.
      - name: Script tests
        run: bash script/tests/release-notes.sh

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Every crate: trek-remote (the phone server's protocol, TLS and pairing) and trek-ipc too.
      # nextest runs each test as its own process across all cores rather than libtest's
      # binary-at-a-time serial run; `--no-fail-fast` reports every failing test, not just the first.
      - name: Test
        run: cargo nextest run --workspace --locked --no-fail-fast

      # nextest doesn't cover doc-tests.
      - name: Doc-tests
        run: cargo test --workspace --doc --locked

      # Lints that catch bugs fail the build; style lints don't (`-A clippy::all` first, so the
      # `-D warnings` above doesn't turn them into errors).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -A clippy::all -D clippy::correctness -D clippy::suspicious

  # The Windows port runs the same suite as the Mac (Phase 5 of the port): the runner's Git for
  # Windows, PowerShell 7 and Windows PowerShell cover what the tests spawn.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    # Slower than the Mac: a cold build of the whole workspace plus the ConPTY tests' waits.
    timeout-minutes: 120
    steps:
      # Deep build paths under the runner's workspace can pass MAX_PATH.
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows-port' }}
          cache-workspace-crates: true

      # The PowerShell twin of the Mac's `zsh -n` over the shell scripts.
      - name: Scripts parse
        run: |
          foreach ($f in Get-ChildItem script\*.ps1, script\lib\*.ps1, script\tests\*.ps1 -ErrorAction SilentlyContinue) {
            [void][scriptblock]::Create((Get-Content -Raw -LiteralPath $f.FullName))
          }

      # Assertions over the release-manifest merge the Windows release runs (the step above
      # only checks syntax).
      - name: Script tests
        run: script\tests\release-manifest.Tests.ps1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Every crate: trek-remote (the phone server's protocol, TLS and pairing) and trek-ipc too.
      # nextest runs each test as its own process across all cores rather than libtest's
      # binary-at-a-time serial run; `--no-fail-fast` reports every failing test, not just the first.
      # TREK_QUIET_SPAWNS_CONTROL: the console-window check's control, which would flash windows on
      # a desktop, runs here (crates/trek-core/tests/quiet_spawns.rs).
      - name: Test
        run: cargo nextest run --workspace --locked --no-fail-fast
        env:
          TREK_QUIET_SPAWNS_CONTROL: "1"

      # nextest doesn't cover doc-tests.
      - name: Doc-tests
        run: cargo test --workspace --doc --locked
        env:
          TREK_QUIET_SPAWNS_CONTROL: "1"

      # Lints that catch bugs fail the build; style lints don't (`-A clippy::all` first, so the
      # `-D warnings` above doesn't turn them into errors).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -A clippy::all -D clippy::correctness -D clippy::suspicious
