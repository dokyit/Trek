name: Live

# Every feature in docs/parity/ledger.toml with live steps, run in the capture build (an isolated
# Trek driven by commands, `crates/trek-app/src/shots.rs`) on a Mac, a PC and Linux: the same steps on
# each, so a feature that works on one and not another fails here, rather than being found by a
# user. `cargo run -p trek-parity --bin parity-live` runs them (it's what a developer runs against
# their own capture build); each job writes its report to the run's summary and keeps it, every
# feature's screenshot and the app's log as artifacts.
#
# Once per pull request, before it merges, not on every push (docs/CROSS_PLATFORM.md, "The live
# checks"): when a pull request is marked ready for review, when it's given the label `live`, and,
# once it has that label, on each later push to it, so what merges is what was checked. And on
# every push to main, and on a dispatch. A pull request without the label, or a draft, runs only
# the small first job, which sets the pull request's head's "Live" status: passed when the change
# touches no app code, waiting (for the label) when it does, and the checks' verdict once they ran.
#
#   gh pr edit <number> --add-label live      the merger's one command, before merging
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run that will check (`decide` below says the same) has a group of its own, so a label added for
# something else, or a push before the label, never cancels the checks underway.
concurrency:
  group: live-${{ github.ref }}-${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'live') || (github.event.action != 'labeled' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'live')) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Whether this event runs the checks, whether the change touches app code (any file but the docs,
  # the site, the iPhone app, media, the brand files and the other workflows: the ledger's steps in
  # docs/parity/ are app code here), and the pull request head's "Live" status that says so.
  decide:
    name: Live plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      app: ${{ steps.decide.outputs.app }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Decide
        id: decide
        env:
          RUN: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'live') || (github.event.action != 'labeled' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'live')) }}
        run: |
          app=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # What the merge commit brings to main, a moved file at both paths (script/live-plan.py:
            # a file in a crate, or one a crate reads, is app code, Markdown and ios/ too).
            app=$(python3 script/live-plan.py)
          fi
          # A change with no app code runs nothing, even marked ready or labelled.
          run=false
          if [ "$RUN" = true ] && [ "$app" = true ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Live checks run: $run (this event asks: $RUN); the change touches app code: $app" >> "$GITHUB_STEP_SUMMARY"
      - name: The pull request's Live status
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ steps.decide.outputs.run }}
          APP: ${{ steps.decide.outputs.app }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$APP" != true ]; then state=success; what="no app code changed: no live checks needed"
          elif [ "$RUN" = true ]; then state=pending; what="the live checks are running"
          else
            # Already checked on this very head (a label for something else, a reopen): leave it.
            if gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" --jq '[.[] | select(.context == "Live")][0].state' | grep -qx success; then exit 0; fi
            state=pending; what="waiting for the live label: gh pr edit ${{ github.event.pull_request.number }} --add-label live"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=Live -f description="$what" -f target_url="$url" > /dev/null
          echo "Live: $state, $what"

  live-macos:
    name: Live (macOS)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-15
    # A pull request builds the app cold until main has saved this workflow's cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # rustfmt: Format Document runs it on a Rust file; rust-analyzer: the editor's language server.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, November 2026
        with:
          toolchain: '1.99.0'
          components: rustfmt, rust-analyzer

      - name: Cache key
        id: key
        run: python3 script/ci-cache.py key live

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.restore }}

      - name: Cache freshness
        run: python3 script/ci-cache.py restore

      - name: Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      # The mock agent's video makes its clip with ffmpeg: the step fails if it isn't there after.
      - name: ffmpeg
        run: |
          command -v ffmpeg || brew install ffmpeg || { sleep 20; brew install ffmpeg; }
          ffmpeg -version | head -1

      # The capture build in the log (its time, and any error) before the driver starts the app; the
      # driver's own build then finds it done. It builds into target/shots: the shots feature
      # changes the whole GPUI stack's fingerprints.
      - name: Build the capture build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/shots
        run: cargo build --locked -p trek-app --features shots

      # Computer use by element reads another app through Trek's own computer tools (`trek-mcp
      # computer`), as an agent does: built here and named to the app. It reads the Accessibility
      # tree, which only a process the user allowed may read: allowed here, on CI's own Mac, for
      # trek-mcp and for the capture build that starts it (the one macOS holds responsible).
      - name: Computer use's trek-mcp, allowed Accessibility
        continue-on-error: true
        run: |
          cargo build --locked -p trek-mcp
          echo "TREK_MCP_BIN=$PWD/target/debug/trek-mcp" >> "$GITHUB_ENV"
          runtime=$(./.agents/skills/verify-trek/scripts/trek-dev status | python3 -c 'import json, sys; print(json.load(sys.stdin)["runtime_dir"])')
          for client in "$PWD/target/debug/trek-mcp" "$runtime/bin/trek"; do
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServiceAccessibility', '$client', 1, 2, 4, 1, 0, CAST(strftime('%s','now') AS INTEGER));" \
              && echo "Accessibility allowed: $client"
          done

      # Its output to a file: the app it starts would hold the step's own open otherwise. The mic
      # and Study's Talk show as in the installed app: an unbundled build hides them unless told
      # (`TREK_DICTATE=1`; a tap then says it's the installed app's to ask for the microphone).
      - name: Start the capture build
        env:
          TREK_DICTATE: '1'
        run: |
          ./.agents/skills/verify-trek/scripts/trek-dev start > start.json 2>&1 < /dev/null || { cat start.json; exit 1; }
          cat start.json

      - name: Live checks
        run: |
          runtime=$(./.agents/skills/verify-trek/scripts/trek-dev status | python3 -c 'import json, sys; print(json.load(sys.stdin)["runtime_dir"])')
          echo "RUNTIME=$runtime" >> "$GITHUB_ENV"
          cargo build -p trek-parity --bin parity-live --locked
          cargo run -q -p trek-parity --bin parity-live --locked -- --shot-dir "$runtime/shot" --report live-macos.md --ci

      - name: Report
        if: always()
        run: |
          if [ -f live-macos.md ]; then cat live-macos.md >> "$GITHUB_STEP_SUMMARY"; fi
          ./.agents/skills/verify-trek/scripts/trek-dev stop > /dev/null 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-macos-${{ github.run_attempt }}
          path: |
            live-macos.md
            start.json
            ${{ env.RUNTIME }}/shot/live-*.png
            ${{ env.RUNTIME }}/trek.log
          if-no-files-found: warn
          retention-days: 7

      - name: Cache contents
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: python3 script/ci-cache.py prune

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}

  live-windows:
    name: Live (Windows)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: windows-2022
    # A pull request builds the app cold until main has saved this workflow's cache.
    timeout-minutes: 120
    # As the test jobs link (ci.yml): faster than link.exe for an app this size.
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # rustfmt: Format Document runs it on a Rust file; rust-analyzer: the editor's language server.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, November 2026
        with:
          toolchain: '1.99.0'
          components: rustfmt, rust-analyzer

      - name: Cache key
        id: key
        run: python script/ci-cache.py key live

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.restore }}

      - name: Cache freshness
        run: python script/ci-cache.py restore

      # The mock agent's video makes its clip with ffmpeg. Chocolatey's feed answers 504 at times,
      # and `choco` then installs nothing and still exits 0: video-transcripts and video-posters
      # failed with nothing wrong (run 46022931315). So: a few tries, and the step fails if there's
      # still no ffmpeg, rather than the checks failing for want of it.
      - name: ffmpeg
        run: |
          foreach ($try in 1..4) {
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            choco install ffmpeg -y --no-progress
            Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -ErrorAction SilentlyContinue
            refreshenv | Out-Null
            if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds (15 * $try) }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw 'ffmpeg could not be installed (Chocolatey)' }
          ffmpeg -version | Select-Object -First 1

      # The capture build in the log (its time, and any error) before the driver starts the app; the
      # driver's own build then finds it done.
      - name: Build the capture build
        run: cargo build --locked -p trek-app --features shots

      # The runner's screen is 1024×768, where the app's 1280-wide window can't fit: Trek narrows
      # and folds away the hub column (it needs 916 points beside the sidebar), and the checks
      # that look in it fail. A screen the size people use, the first mode the display takes.
      - name: Screen
        continue-on-error: true
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class TrekScreen {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
              public struct DEVMODE {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
                  public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
                  public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
                  public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2;
                  public int dmPanningWidth, dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Ansi)]
              static extern int EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
              [DllImport("user32.dll", CharSet = CharSet.Ansi)]
              static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
              public static int Set(int width, int height) {
                  var dm = new DEVMODE();
                  dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  if (EnumDisplaySettings(null, -1, ref dm) == 0) return -100;
                  dm.dmPelsWidth = width;
                  dm.dmPelsHeight = height;
                  dm.dmFields = 0x80000 | 0x100000;
                  return ChangeDisplaySettings(ref dm, 0);
              }
          }
          '@
          foreach ($mode in @(@(1920, 1080), @(1680, 1050), @(1600, 900), @(1440, 900), @(1280, 1024))) {
              $result = [TrekScreen]::Set($mode[0], $mode[1])
              "$($mode[0])x$($mode[1]): $result"
              if ($result -eq 0) { break }
          }
          Add-Type -AssemblyName System.Windows.Forms
          "The screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      # Computer use by element reads another app through Trek's own computer tools (`trek-mcp
      # computer`), as an agent does: built here, and named to the app.
      - name: Build trek-mcp
        run: |
          cargo build --locked -p trek-mcp
          "TREK_MCP_BIN=$((Get-Location).Path)\target\debug\trek-mcp.exe" >> $env:GITHUB_ENV

      # The driver starts the app through the shell, handing it none of the step's handles, so the
      # step ends once the app answers (an app holding the step's output pipe kept it waiting
      # until the job ran out of time). Its JSON goes to a file, kept with the artifacts.
      - name: Start the capture build
        run: |
          pwsh -NoProfile -File .agents/skills/verify-trek/scripts/trek-dev.ps1 start *> start.json
          Get-Content start.json
          if (-not (Select-String -Path start.json -Pattern '"running": true' -Quiet)) { exit 1 }

      # The runner's Windows has no HEIF or HEVC codec (Microsoft's HEIF and HEVC Video
      # Extensions): no HEIC photo can be made there to attach. And it's Windows Server, which has
      # no share window: Windows asks an app for nothing to share there.
      - name: Live checks
        run: |
          $status = pwsh -NoProfile -File .agents/skills/verify-trek/scripts/trek-dev.ps1 status | ConvertFrom-Json
          "RUNTIME=$($status.runtime_dir)" >> $env:GITHUB_ENV
          cargo build -p trek-parity --bin parity-live --locked
          cargo run -q -p trek-parity --bin parity-live --locked -- --shot-dir "$($status.runtime_dir)\shot" --report live-windows.md --ci --skip "heic-photos=the runner's Windows has no HEIF or HEVC codec" --skip "share-sheet=the runner's Windows Server has no share window (its steps pass on Windows 11: the ledger's note)"
          exit $LASTEXITCODE

      - name: Report
        if: always()
        run: |
          if (Test-Path live-windows.md) { Get-Content live-windows.md | Add-Content $env:GITHUB_STEP_SUMMARY }
          pwsh -NoProfile -File .agents/skills/verify-trek/scripts/trek-dev.ps1 stop *> $null
          # Into the workspace: the runtime is on C: and the checkout on D:, and an artifact's files
          # need a folder in common.
          New-Item -ItemType Directory -Force live-files | Out-Null
          if ($env:RUNTIME) { Copy-Item "$env:RUNTIME/shot/live-*.png", "$env:RUNTIME/trek.log" live-files -ErrorAction SilentlyContinue }
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-windows-${{ github.run_attempt }}
          path: |
            live-windows.md
            start.json
            live-files/
          if-no-files-found: warn
          retention-days: 7

      - name: Cache contents
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: python script/ci-cache.py prune

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}

  # Linux: the capture build on Xvfb, drawn by Mesa's software OpenGL (llvmpipe), as an X11 client:
  # what Trek is in a Wayland session too, through Xwayland (linux_gtk::prefer_x11). The verify
  # driver is the Mac's (`trek-dev`, which runs on Linux), and the steps are the ledger's: Linux's
  # own where they differ (`live_linux`), with what a runner without a desktop can't show skipped
  # with its reason.
  live-linux:
    name: Live (Linux)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-22.04
    # A pull request builds the app cold until main has saved this workflow's cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # What Trek links, what draws and shows it without a screen (Xvfb, Mesa), and ffmpeg for the
      # mock agent's video.
      - name: System packages
        run: |
          sudo sh script/linux/packages.sh --with-run-tools
          sudo apt-get install -y --no-install-recommends ffmpeg

      # rustfmt: Format Document runs it on a Rust file; rust-analyzer: the editor's language server.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, November 2026
        with:
          toolchain: '1.99.0'
          components: rustfmt, rust-analyzer

      - name: Cache key
        id: key
        run: python3 script/ci-cache.py key live

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.restore }}

      - name: Cache freshness
        run: python3 script/ci-cache.py restore

      - name: Build the capture build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/shots
        run: cargo build --locked -p trek-app --features shots

      # Xvfb and a session bus that stay up for the steps below (their variables go to the job's
      # environment).
      - name: Display
        run: script/linux/headless.sh --size 1920x1200 --keep >> "$GITHUB_ENV"

      - name: Build trek-mcp
        run: |
          cargo build --locked -p trek-mcp
          echo "TREK_MCP_BIN=$PWD/target/debug/trek-mcp" >> "$GITHUB_ENV"

      # Its output to a file: the app it starts would hold the step's own open otherwise.
      - name: Start the capture build
        run: |
          ./.agents/skills/verify-trek/scripts/trek-dev start > start.json 2>&1 < /dev/null || { cat start.json; exit 1; }
          cat start.json

      - name: Live checks
        run: |
          runtime=$(./.agents/skills/verify-trek/scripts/trek-dev status | python3 -c 'import json, sys; print(json.load(sys.stdin)["runtime_dir"])')
          echo "RUNTIME=$runtime" >> "$GITHUB_ENV"
          cargo build -p trek-parity --bin parity-live --locked
          cargo run -q -p trek-parity --bin parity-live --locked -- --shot-dir "$runtime/shot" --report live-linux.md --ci --skip "status-icon=the runner has no desktop to host a tray icon (no StatusNotifierWatcher on its session bus)" --skip "heic-photos=Linux has no HEIF encoder to make the photo the check attaches (and Trek doesn't convert HEIC there: the ledger's note)" --skip "rendering-cost=Mesa's software OpenGL on the runner draws a few frames a second, under the frame counts the check holds a GPU to" --skip "no-runtime-to-install=Trek links the desktop's GTK and WebKitGTK on Linux (partial: the ledger's note), which the check's Windows and Mac halves have no Linux twin for"

      - name: Report
        if: always()
        run: |
          if [ -f live-linux.md ]; then cat live-linux.md >> "$GITHUB_STEP_SUMMARY"; fi
          ./.agents/skills/verify-trek/scripts/trek-dev stop > /dev/null 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-linux-${{ github.run_attempt }}
          path: |
            live-linux.md
            start.json
            ${{ env.RUNTIME }}/shot/live-*.png
            ${{ env.RUNTIME }}/shot/live-computer-open-*.log
            ${{ env.RUNTIME }}/shot/live-computer-open-*.exit
            ${{ env.RUNTIME }}/trek.log
          if-no-files-found: warn
          retention-days: 7

      - name: Cache contents
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: python3 script/ci-cache.py prune

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}

  # The verdict on the pull request's head, as its "Live" status (what a merger, and branch
  # protection, can wait for): the three jobs above passed, or not.
  report:
    name: Live result
    needs: [decide, live-macos, live-windows, live-linux]
    if: always() && needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Live status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULTS: ${{ needs.live-macos.result }} ${{ needs.live-windows.result }} ${{ needs.live-linux.result }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULTS" = "success success success" ]; then state=success; what="macOS, Windows and Linux passed"
          else state=failure; what="macOS, Windows, Linux: $RESULTS"; fi
          echo "Live: $state ($what)"
          if [ "$FORK" != true ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=Live -f description="$what" -f target_url="$url" > /dev/null
          fi
          [ "$state" = success ]
