name: Release

# Publish a whole Trek release from any machine (docs/RELEASING.md, "Publishing from anywhere").
# The macOS job runs script/release.sh on GitHub's Mac, as the maintainer's Mac would: builds and
# code-signs Trek.app with "Trek Local Signing", minisigns the archive, tags, and creates (or, for
# beta and nightly, refreshes) the GitHub release with darwin-aarch64 in <channel>.json. The
# Windows build runs alongside it (release.ps1 -BuildOnly: its own version bump, cargo build, zip,
# Inno installer, minisig); only the publish half needs the Mac's release, so a short publish job
# does the manifest merge and upload once both are done (release.ps1 -PublishOnly -Publish). The
# Intel Mac build runs alongside them too and joins the release after Windows (jobs intel,
# publish-intel), and the Linux builds (x86_64 and Arm, on runners of each) join it last (jobs
# linux, publish-linux: script/release-linux.sh).
#
#   gh workflow run release.yml -f version=0.4.1-beta.4 -f channel=beta
#   gh workflow run release.yml -f version=0.4.1-beta.4 -f channel=beta -f dry_run=true
#
# Run it on the branch to release from (--ref, or the branch picker): a stable release commits
# "Release v<version>" to that branch. A dry run builds and signs both halves and publishes
# nothing: no commit, no tag, no release.
#
# Secrets (Settings > Secrets and variables > Actions):
#   TREK_MINISIGN_KEY           the whole ~/.trek-signing/minisign.key file, pasted
#   TREK_MINISIGN_PASSWORD      that key's password, if it has one
#   TREK_CODESIGN_P12           base64 of ~/.trek-signing/codesign.p12
#   TREK_CODESIGN_P12_PASSWORD  ~/.trek-signing/codesign.p12.password
# A dry run without the two TREK_CODESIGN_* secrets signs with a throwaway identity.
#
# Optional, all five or none (docs/RELEASING.md, "Gatekeeper and notarization"): with them the
# app and the disk image are signed with the Developer ID instead and notarized by Apple, so
# macOS opens Trek without the Privacy & Security › Open Anyway detour. Without them that step
# is logged as skipped.
#   TREK_DEVELOPER_ID_P12           base64 of a "Developer ID Application" certificate + key (.p12)
#   TREK_DEVELOPER_ID_P12_PASSWORD  its password
#   APPLE_NOTARY_KEY                an App Store Connect API key's AuthKey_<id>.p8, pasted whole
#   APPLE_NOTARY_KEY_ID             that key's ID
#   APPLE_NOTARY_ISSUER_ID          the team's issuer ID (Users and Access › Integrations)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.4.1, 0.4.1-beta.4, 0.4.1-nightly.20261011)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta
          - nightly
      notes:
        description: 'Release notes (Markdown); empty: the commit subjects since the last release. The install block (the Mac, Windows and Linux downloads) is added to the GitHub release body for you, unless the notes already have one'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run: build and sign both halves, publish nothing'
        required: false
        type: boolean
        default: false
      skip_ci_check:
        description: 'Release even though CI has not passed on this commit (an emergency fix only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One release per channel at a time. A dry run queues apart, so it never holds up a real one.
concurrency:
  group: release-${{ inputs.channel }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Incremental builds don't help a fresh runner and bloat the cache.
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # PostHog, for the usage data and crash reports users say yes to, and feedback (docs/PRIVACY.md):
  # compiled into every build. Repository *variables*, not secrets (Settings > Secrets and
  # variables > Actions > Variables): a project key (phc_…) can only add events, and ships in the
  # app anyway. Unset, the build asks as usual and sends nothing; the host defaults to PostHog's
  # US cloud.
  TREK_POSTHOG_KEY: ${{ vars.TREK_POSTHOG_KEY }}
  TREK_POSTHOG_HOST: ${{ vars.TREK_POSTHOG_HOST }}

jobs:
  # A release is built from a commit CI passed on: both platforms' tests and lints. v0.4.49 went out
  # after a red run. One exception: this version's own "Release v<version>" commit, which a run that
  # failed after pushing it leaves on main and which CI never runs on (the workflow's token pushed
  # it). When the diff proves it changes nothing but the version (script/lib/release-finish.sh
  # is-bump), CI on its parent counts. A dry run isn't held up (it publishes nothing; it says what
  # the check found), nor a release whose skip_ci_check says it can't wait.
  ci-passed:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      # Two deep: the commit and its parent, for the bump check.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: CI's runs of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP: ${{ inputs.skip_ci_check }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          passed() { # commit: has a CI run of it succeeded?
            local conclusions
            conclusions=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$1&status=completed&per_page=20" --jq '[.workflow_runs[].conclusion] | join(" ")')
            echo "CI on $1: ${conclusions:-no completed run}"
            [[ " $conclusions " == *" success "* ]]
          }
          verdict() { # what the check found; enforced only for a real release without skip_ci_check
            if [[ $DRY_RUN == true || $SKIP == true ]]; then
              echo "Not enforced: dry run ($DRY_RUN), skip_ci_check ($SKIP). $1"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }
          if passed "$GITHUB_SHA"; then exit 0; fi
          if why=$(script/lib/release-finish.sh is-bump "$GITHUB_SHA" "$VERSION" 2>&1); then
            echo "$why"
            parent=$(git rev-parse "$GITHUB_SHA^1")
            if passed "$parent"; then
              echo "Released on CI's pass of $parent, the commit this version bump is on."
              exit 0
            fi
            verdict "CI hasn't passed on $GITHUB_SHA's parent $parent either (this commit is only the version bump). Release a commit CI passed on, or run again with skip_ci_check for an emergency fix."
          fi
          echo "Not only the v${VERSION#v} bump, so its parent's CI doesn't count: $why"
          verdict "CI hasn't passed on $GITHUB_SHA (macOS, Windows and Linux). Release a commit it passed on, or run again with skip_ci_check for an emergency fix."

  macos:
    name: macOS app
    needs: ci-passed
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      # Full history and tags: release.sh checks the version against earlier releases' tags and
      # writes the notes from the commits since the last one. The checkout keeps its token, which
      # pushes release.sh's tags (and a stable release's commit).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, November 2026
        with:
          toolchain: '1.99.0'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The release-profile cache warm-release.yml keeps hot on every main push. Not shared
          # with ci.yml's dev-profile cache (a release build can't reuse its artifacts).
          shared-key: release
          save-if: false

      # gpui compiles its Metal shaders at build time with `xcrun metal` (see ci.yml).
      - name: Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      # bundle.sh renders the icons with resvg (the icon's Assets.car is compiled ahead, in
      # assets/brand/AppIcon-compiled: this image's default Xcode can't compile an Icon Composer
      # .icon); pigz compresses the archive on every core.
      # iconutil, PlistBuddy, codesign, python3 and gh are on the image already.
      - name: Install resvg and pigz
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install resvg pigz

      # script/dmg.sh installs dmgbuild (pinned by hash) into a virtualenv; it needs Python 3.10
      # or later, and the image's /usr/bin/python3 is older.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # Pinned by hash: this binary signs every update. (The zip's own .minisig verifies with
      # jedisct1's key, RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3; the hash below
      # was taken from a copy that did.) An arm64 build, like macos-15.
      - name: Install minisign
        run: |
          ver=0.12
          zip="$RUNNER_TEMP/minisign-$ver-macos.zip"
          curl -fsSL -o "$zip" "https://github.com/jedisct1/minisign/releases/download/$ver/minisign-$ver-macos.zip"
          expected=89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63
          actual=$(shasum -a 256 "$zip" | cut -d' ' -f1)
          if [[ $actual != "$expected" ]]; then
            echo "::error::minisign $ver macos sha256 mismatch: got $actual, want $expected"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/minisign"
          unzip -q -o "$zip" minisign -d "$RUNNER_TEMP/minisign"
          chmod +x "$RUNNER_TEMP/minisign/minisign"
          "$RUNNER_TEMP/minisign/minisign" -v
          echo "$RUNNER_TEMP/minisign" >> "$GITHUB_PATH"

      # Who the release commit and tags are by.
      - name: Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Before a long build, the token must be able to push what release.sh pushes, and gh must
      # take it (release.sh's own `gh auth status` runs only for a real release). --dry-run
      # authenticates against the push endpoint and sends nothing (its "[new tag]" line is what
      # it would have done).
      # A re-run of a run that pushed its "Release v<version>" (or one a person pushed) carries on
      # from that commit (release-finish.sh adopt), so main fast-forwards to it first.
      - name: GitHub access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          gh auth status
          git push --dry-run origin "HEAD:refs/tags/trek-push-probe-$GITHUB_RUN_ID"
          if [[ $CHANNEL == stable ]]; then
            if [[ $DRY_RUN != true ]]; then script/lib/release-finish.sh adopt "$VERSION" "$GITHUB_REF_NAME"; fi
            git push --dry-run origin HEAD
          fi

      # The secret is the key file's whole contents (it is all ASCII). Keys and the keychain live
      # in RUNNER_TEMP and go in the last step, whatever happens.
      - name: minisign secret key
        env:
          KEY_FILE: ${{ secrets.TREK_MINISIGN_KEY }}
        run: |
          if [[ -z ${KEY_FILE//[[:space:]]/} ]]; then
            echo "::error::the TREK_MINISIGN_KEY secret is not set (docs/RELEASING.md)"
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY_FILE" > "$RUNNER_TEMP/minisign.key"
          echo "TREK_MINISIGN_KEY=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"

      # "Trek Local Signing" in a keychain of its own: unlocked, codesign allowed to use the key
      # without a prompt (the partition list), searched before the login keychain. macOS ties
      # users' Accessibility and Screen Recording grants to this certificate, so a real release
      # takes the one from the secrets or fails; only a dry run may make a throwaway one, with
      # script/signing-identity.sh, and it goes through the same import.
      - name: Code-signing identity
        env:
          P12_BASE64: ${{ secrets.TREK_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.TREK_CODESIGN_P12_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/trek-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          if [[ -z ${P12_BASE64//[[:space:]]/} ]]; then
            if [[ $DRY_RUN != true ]]; then
              echo "::error::the TREK_CODESIGN_P12 secret is not set; a release is signed with the real \"Trek Local Signing\" (docs/RELEASING.md)"
              exit 1
            fi
            echo "• no TREK_CODESIGN_P12 secret: this dry run signs with a throwaway \"Trek Local Signing\""
            dir="$RUNNER_TEMP/throwaway-signing"
            scratch="$RUNNER_TEMP/throwaway.keychain-db"
            security create-keychain -p "$keychain_password" "$scratch"
            security unlock-keychain -p "$keychain_password" "$scratch"
            TREK_SIGNING_DIR=$dir TREK_SIGNING_KEYCHAIN=$scratch script/signing-identity.sh
            # Gone before the real keychain exists: two identities of one name would be ambiguous.
            security delete-keychain "$scratch"
            # Handed on as the two secrets would be, so the decode and import below are the
            # ones a real release runs.
            P12_BASE64=$(base64 < "$dir/codesign.p12")
            P12_PASSWORD=$(cat "$dir/codesign.p12.password")
            echo "::add-mask::$P12_PASSWORD"
            rm -rf "$dir"
          fi
          # A password file pasted into `gh secret set` may carry its line ending.
          p12_password=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')
          if [[ -z $p12_password ]]; then
            echo "::error::TREK_CODESIGN_P12 is set but TREK_CODESIGN_P12_PASSWORD isn't (docs/RELEASING.md)"
            exit 1
          fi
          p12="$RUNNER_TEMP/codesign.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$p12_password" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$p12"
          searched=()
          while IFS= read -r k; do searched+=("$k"); done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" "${searched[@]}"
          if ! security find-identity -p codesigning "$keychain" | grep -qF '"Trek Local Signing"'; then
            echo "::error::the p12 holds no \"Trek Local Signing\" identity"
            exit 1
          fi
          echo "• \"Trek Local Signing\" ready in $keychain"
          echo "TREK_SIGN_IDENTITY=Trek Local Signing" >> "$GITHUB_ENV"

      # Developer ID signing and notarization, when all five secrets are there: the Developer ID
      # goes into a keychain of its own and becomes TREK_SIGN_IDENTITY (script/lib/sign.sh then
      # adds the hardened runtime and a timestamp), and release.sh notarizes the app and the disk
      # image with the API key (script/notarize.sh). Some but not all of them: a warning, and the
      # release goes out as before. Switching identity once resets users' Accessibility and
      # Screen Recording grants and locks Trek's old Keychain items (docs/RELEASING.md).
      - name: Developer ID and notarization (optional)
        env:
          DEVID_P12_BASE64: ${{ secrets.TREK_DEVELOPER_ID_P12 }}
          DEVID_P12_PASSWORD: ${{ secrets.TREK_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          [[ -n ${DEVID_P12_BASE64//[[:space:]]/} ]] || missing+=(TREK_DEVELOPER_ID_P12)
          [[ -n ${DEVID_P12_PASSWORD//[[:space:]]/} ]] || missing+=(TREK_DEVELOPER_ID_P12_PASSWORD)
          [[ -n ${NOTARY_KEY//[[:space:]]/} ]] || missing+=(APPLE_NOTARY_KEY)
          [[ -n ${NOTARY_KEY_ID//[[:space:]]/} ]] || missing+=(APPLE_NOTARY_KEY_ID)
          [[ -n ${NOTARY_ISSUER_ID//[[:space:]]/} ]] || missing+=(APPLE_NOTARY_ISSUER_ID)
          if (( ${#missing[@]} == 5 )); then
            echo "• notarization skipped: no Developer ID or notary secrets. Signed with \"Trek Local Signing\"; macOS asks once on first launch (Privacy & Security › Open Anyway)"
            exit 0
          fi
          if (( ${#missing[@]} )); then
            echo "::warning::notarization skipped: ${missing[*]} not set (all five Developer ID and notary secrets are needed; docs/RELEASING.md)"
            exit 0
          fi
          umask 077
          keychain="$RUNNER_TEMP/trek-developer-id.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVID_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 \
            -P "$(printf '%s' "$DEVID_P12_PASSWORD" | tr -d '\r\n')" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$p12"
          searched=()
          while IFS= read -r k; do searched+=("$k"); done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" "${searched[@]}"
          identity=$(security find-identity -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          if [[ -z $identity ]]; then
            echo "::error::TREK_DEVELOPER_ID_P12 holds no valid \"Developer ID Application\" identity"
            exit 1
          fi
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "TREK_SIGN_IDENTITY=$identity"
            echo "TREK_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "TREK_NOTARY_KEY_ID=$(printf '%s' "$NOTARY_KEY_ID" | tr -d '[:space:]')"
            echo "TREK_NOTARY_ISSUER=$(printf '%s' "$NOTARY_ISSUER_ID" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"
          echo "• signing with \"$identity\" and notarizing with Apple"

      # Inputs go through env, never straight into the script text.
      - name: script/release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TREK_MINISIGN_PASSWORD: ${{ secrets.TREK_MINISIGN_PASSWORD }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("$VERSION" --channel "$CHANNEL")
          if [[ -n ${NOTES//[[:space:]]/} ]]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
            args+=(--notes "$RUNNER_TEMP/notes.md")
          fi
          if [[ $DRY_RUN == true ]]; then args+=(--dry-run); fi
          script/release.sh "${args[@]}"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          VERSION=${VERSION#v}
          out="dist/release/$VERSION"
          name="Trek-$VERSION-darwin-aarch64.app.tar.gz"
          dmg="Trek-$VERSION-darwin-aarch64.dmg"
          sha=$(shasum -a 256 "$out/$name" | cut -d' ' -f1)
          dmg_sha=$(shasum -a 256 "$out/$dmg" | cut -d' ' -f1)
          signer=$(codesign -dv --verbose=2 dist/Trek.app 2>&1 | sed -n 's/^Authority=//p' | head -1)
          notarized="not notarized"
          xcrun stapler validate -q "$out/$dmg" 2>/dev/null && notarized="notarized and stapled"
          what="published"; [[ $DRY_RUN == true ]] && what="dry run: nothing published"
          echo "$name  sha256 $sha  (code-signed by \"$signer\")"
          echo "$dmg  sha256 $dmg_sha  ($notarized)"
          cat "$out/$CHANNEL.json"
          # The GitHub release's body, as a real run publishes it (the Windows job adds only assets).
          echo "--- $out/release-notes.md"
          cat "$out/release-notes.md"
          {
            echo "### macOS ($what)"
            echo
            echo "\`$name\` sha256 \`$sha\`, code-signed by \"$signer\""
            echo
            echo "\`$dmg\` sha256 \`$dmg_sha\`, $notarized"
            echo
            echo '```json'
            cat "$out/$CHANNEL.json"
            echo '```'
            echo
            echo "### Release body ($what)"
            echo
            cat "$out/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # After a failure (here or in any step before): what it left on origin and GitHub, and the one
      # command that resumes the release. Nothing is pushed until the build and signing are done,
      # and then the commit and its tag go in one atomic push, so main is never left with a bump
      # and no tag.
      - name: What the failure left
        if: failure() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          script/lib/release-finish.sh state "$VERSION" "$CHANNEL" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The Windows dry run merges into this manifest, as a real run merges into the release's.
      - name: Manifest for the Windows dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-manifest
          # Any version directory: release.sh takes a leading "v" off the version, the input may not.
          path: dist/release/*/${{ inputs.channel }}.json
          retention-days: 1
          if-no-files-found: error

      # A dry run's disk image, to open and look at (a real run's is on the release).
      - name: Disk image from the dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-dmg
          path: dist/release/*/Trek-*-darwin-*.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Remove keys and keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/trek-signing.keychain-db" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/throwaway.keychain-db" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/trek-developer-id.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/minisign.key" "$RUNNER_TEMP/codesign.p12" "$RUNNER_TEMP/throwaway-signing" "$RUNNER_TEMP/notes.md"
          rm -rf "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"

  # The Intel Mac build (docs/RELEASING.md, "Intel Macs"): the same app for x86_64-apple-darwin,
  # cross-built on the same kind of runner with the same tools, signed the same way. Each step
  # below that has the macos job's name is that step, and changes with it. It publishes nothing
  # itself (publish-intel does, once the others are done), so if it fails the release still goes
  # out for Apple silicon and Windows, and Intel Macs hear that their build is on its way.
  intel:
    name: macOS app (Intel)
    needs: ci-passed
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, November 2026
        with:
          toolchain: '1.99.0'
          targets: x86_64-apple-darwin

      # A key of its own: the "release" cache holds Apple-silicon artifacts. warm-release.yml doesn't
      # keep this one hot; the first run builds everything, and saves it for the next.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-intel
          save-if: ${{ inputs.dry_run != true }}

      - name: Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Install resvg and pigz
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install resvg pigz

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install minisign
        run: |
          ver=0.12
          zip="$RUNNER_TEMP/minisign-$ver-macos.zip"
          curl -fsSL -o "$zip" "https://github.com/jedisct1/minisign/releases/download/$ver/minisign-$ver-macos.zip"
          expected=89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63
          actual=$(shasum -a 256 "$zip" | cut -d' ' -f1)
          if [[ $actual != "$expected" ]]; then
            echo "::error::minisign $ver macos sha256 mismatch: got $actual, want $expected"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/minisign"
          unzip -q -o "$zip" minisign -d "$RUNNER_TEMP/minisign"
          chmod +x "$RUNNER_TEMP/minisign/minisign"
          "$RUNNER_TEMP/minisign/minisign" -v
          echo "$RUNNER_TEMP/minisign" >> "$GITHUB_PATH"

      # bundle.sh runs the Intel trek-mcp once, to compile the iPhone helper for Intel.
      - name: Rosetta
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: minisign secret key
        env:
          KEY_FILE: ${{ secrets.TREK_MINISIGN_KEY }}
        run: |
          if [[ -z ${KEY_FILE//[[:space:]]/} ]]; then
            echo "::error::the TREK_MINISIGN_KEY secret is not set (docs/RELEASING.md)"
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY_FILE" > "$RUNNER_TEMP/minisign.key"
          echo "TREK_MINISIGN_KEY=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"

      - name: Code-signing identity
        env:
          P12_BASE64: ${{ secrets.TREK_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.TREK_CODESIGN_P12_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/trek-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          if [[ -z ${P12_BASE64//[[:space:]]/} ]]; then
            if [[ $DRY_RUN != true ]]; then
              echo "::error::the TREK_CODESIGN_P12 secret is not set; a release is signed with the real \"Trek Local Signing\" (docs/RELEASING.md)"
              exit 1
            fi
            echo "• no TREK_CODESIGN_P12 secret: this dry run signs with a throwaway \"Trek Local Signing\""
            dir="$RUNNER_TEMP/throwaway-signing"
            scratch="$RUNNER_TEMP/throwaway.keychain-db"
            security create-keychain -p "$keychain_password" "$scratch"
            security unlock-keychain -p "$keychain_password" "$scratch"
            TREK_SIGNING_DIR=$dir TREK_SIGNING_KEYCHAIN=$scratch script/signing-identity.sh
            security delete-keychain "$scratch"
            P12_BASE64=$(base64 < "$dir/codesign.p12")
            P12_PASSWORD=$(cat "$dir/codesign.p12.password")
            echo "::add-mask::$P12_PASSWORD"
            rm -rf "$dir"
          fi
          p12_password=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')
          if [[ -z $p12_password ]]; then
            echo "::error::TREK_CODESIGN_P12 is set but TREK_CODESIGN_P12_PASSWORD isn't (docs/RELEASING.md)"
            exit 1
          fi
          p12="$RUNNER_TEMP/codesign.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$p12_password" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$p12"
          searched=()
          while IFS= read -r k; do searched+=("$k"); done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" "${searched[@]}"
          if ! security find-identity -p codesigning "$keychain" | grep -qF '"Trek Local Signing"'; then
            echo "::error::the p12 holds no \"Trek Local Signing\" identity"
            exit 1
          fi
          echo "• \"Trek Local Signing\" ready in $keychain"
          echo "TREK_SIGN_IDENTITY=Trek Local Signing" >> "$GITHUB_ENV"

      - name: Developer ID and notarization (optional)
        env:
          DEVID_P12_BASE64: ${{ secrets.TREK_DEVELOPER_ID_P12 }}
          DEVID_P12_PASSWORD: ${{ secrets.TREK_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          [[ -n ${DEVID_P12_BASE64//[[:space:]]/} ]] || missing+=(TREK_DEVELOPER_ID_P12)
          [[ -n ${DEVID_P12_PASSWORD//[[:space:]]/} ]] || missing+=(TREK_DEVELOPER_ID_P12_PASSWORD)
          [[ -n ${NOTARY_KEY//[[:space:]]/} ]] || missing+=(APPLE_NOTARY_KEY)
          [[ -n ${NOTARY_KEY_ID//[[:space:]]/} ]] || missing+=(APPLE_NOTARY_KEY_ID)
          [[ -n ${NOTARY_ISSUER_ID//[[:space:]]/} ]] || missing+=(APPLE_NOTARY_ISSUER_ID)
          if (( ${#missing[@]} == 5 )); then
            echo "• notarization skipped: no Developer ID or notary secrets. Signed with \"Trek Local Signing\"; macOS asks once on first launch (Privacy & Security › Open Anyway)"
            exit 0
          fi
          if (( ${#missing[@]} )); then
            echo "::warning::notarization skipped: ${missing[*]} not set (all five Developer ID and notary secrets are needed; docs/RELEASING.md)"
            exit 0
          fi
          umask 077
          keychain="$RUNNER_TEMP/trek-developer-id.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVID_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 \
            -P "$(printf '%s' "$DEVID_P12_PASSWORD" | tr -d '\r\n')" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$p12"
          searched=()
          while IFS= read -r k; do searched+=("$k"); done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" "${searched[@]}"
          identity=$(security find-identity -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          if [[ -z $identity ]]; then
            echo "::error::TREK_DEVELOPER_ID_P12 holds no valid \"Developer ID Application\" identity"
            exit 1
          fi
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "TREK_SIGN_IDENTITY=$identity"
            echo "TREK_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "TREK_NOTARY_KEY_ID=$(printf '%s' "$NOTARY_KEY_ID" | tr -d '[:space:]')"
            echo "TREK_NOTARY_ISSUER=$(printf '%s' "$NOTARY_ISSUER_ID" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"
          echo "• signing with \"$identity\" and notarizing with Apple"

      # --dry-run: build, sign, archive and write this build's manifest, with no commit, tag or
      # release. The macos job does those for the version; publish-intel attaches what's here.
      - name: script/release.sh for Intel
        env:
          TREK_MINISIGN_PASSWORD: ${{ secrets.TREK_MINISIGN_PASSWORD }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
        run: |
          args=("$VERSION" --channel "$CHANNEL" --target x86_64-apple-darwin --dry-run)
          if [[ -n ${NOTES//[[:space:]]/} ]]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
            args+=(--notes "$RUNNER_TEMP/notes.md")
          fi
          script/release.sh "${args[@]}"

      # Under Rosetta: the bundle's Intel code runs, signature and all. (bundle.sh has checked that
      # each executable is x86_64. Drawing can't be tried here: the runner has no Intel GPU.)
      - name: The Intel build starts
        run: arch -x86_64 dist/Trek.app/Contents/MacOS/trek-mcp --version

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION=${VERSION#v}
          out="dist/release/$VERSION"
          name="Trek-$VERSION-darwin-x86_64.app.tar.gz"
          dmg="Trek-$VERSION-darwin-x86_64.dmg"
          sha=$(shasum -a 256 "$out/$name" | cut -d' ' -f1)
          dmg_sha=$(shasum -a 256 "$out/$dmg" | cut -d' ' -f1)
          {
            echo "### macOS, Intel"
            echo
            echo "\`$name\` sha256 \`$sha\`"
            echo
            echo "\`$dmg\` sha256 \`$dmg_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # All of it: publish-intel takes the archive, its signature, the disk image and the manifest.
      # A dry run's stays a week, to open and look at.
      - name: Intel build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intel-build
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

      - name: Remove keys and keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/trek-signing.keychain-db" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/throwaway.keychain-db" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/trek-developer-id.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/minisign.key" "$RUNNER_TEMP/codesign.p12" "$RUNNER_TEMP/throwaway-signing" "$RUNNER_TEMP/notes.md"
          rm -rf "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"

  # The Windows build needs nothing the Mac makes: release.ps1 bumps the checked-out version
  # itself. It runs in parallel and hands dist\release\<version>\ to the publish job, which is
  # the only part that waits for the Mac's release (its manifest merge).
  build:
    name: Windows build
    needs: ci-passed
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      # Deep build paths under the runner's workspace can pass MAX_PATH.
      - name: Long paths
        run: git config --system core.longpaths true

      # The commit this run started from: the version tag doesn't exist yet (the macOS job is
      # still building it). Full history for the notes' `git log`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, November 2026
        with:
          toolchain: '1.99.0'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The release-profile cache warm-release.yml keeps hot; a release run only reads it
          # (the version bump rewrites Cargo.lock, so anything it saved wouldn't be reused).
          shared-key: release
          save-if: false

      # The runner image carries the Windows SDK (rc.exe, fxc.exe) that ci.yml's Windows job
      # builds with too, so minisign is the only thing to install. Pinned by hash: this binary
      # signs every update.
      - name: Install minisign
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '0.12'
          $zip = "$env:RUNNER_TEMP\minisign-$ver-win64.zip"
          Invoke-WebRequest "https://github.com/jedisct1/minisign/releases/download/$ver/minisign-$ver-win64.zip" -OutFile $zip
          $expected = '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "minisign $ver win64 sha256 mismatch: got $actual, want $expected" }
          Expand-Archive $zip "$env:RUNNER_TEMP\minisign" -Force
          "TREK_MINISIGN_EXE=$env:RUNNER_TEMP\minisign\minisign-win64\x86_64\minisign.exe" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      # The secret is the key file's whole contents (it is all ASCII).
      - name: minisign secret key
        env:
          TREK_MINISIGN_KEY_FILE: ${{ secrets.TREK_MINISIGN_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TREK_MINISIGN_KEY_FILE)) {
            throw 'the TREK_MINISIGN_KEY secret is not set (docs/RELEASING.md)'
          }
          $key = "$env:RUNNER_TEMP\minisign.key"
          [System.IO.File]::WriteAllText($key, $env:TREK_MINISIGN_KEY_FILE)
          "TREK_MINISIGN_KEY=$key" >> $env:GITHUB_ENV

      # -SkipTests: ci.yml runs the whole suite on every push, and a dev-profile test build
      # against the release cache compiles the world again for no new signal.
      - name: Build, sign and package
        env:
          TREK_MINISIGN_PASSWORD: ${{ secrets.TREK_MINISIGN_PASSWORD }}
          TREK_VERSION: ${{ inputs.version }}
          TREK_CHANNEL: ${{ inputs.channel }}
        run: >-
          ./script/release.ps1 $env:TREK_VERSION -Channel $env:TREK_CHANNEL
          -Minisign $env:TREK_MINISIGN_EXE -BuildOnly -SkipTests

      - name: Windows build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          path: dist/release/
          if-no-files-found: error

  # Linux, alongside the others: an AppImage, a .deb and a tarball per architecture, each built on
  # a runner of its own architecture (Ubuntu 22.04: the oldest glibc Trek's Linux builds support),
  # the AppImage minisigned with the same key (script/release-linux.sh --build-only). Only the
  # manifest merge needs the Mac's release, so the upload waits for publish-linux.
  linux:
    name: Linux build (${{ matrix.arch }})
    needs: ci-passed
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      # The commit this run started from, as the Windows build: the version tag doesn't exist yet.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: System packages
        run: sudo sh script/linux/packages.sh --with-packaging

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, November 2026
        with:
          toolchain: '1.99.0'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-linux-${{ matrix.arch }}
          save-if: false

      # Pinned by hash, as on Windows: this binary signs every update.
      - name: Install minisign
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl -fsSL -o "$tgz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $tgz" | sha256sum -c
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          echo "TREK_MINISIGN=$RUNNER_TEMP/minisign-linux/${{ matrix.arch }}/minisign" >> "$GITHUB_ENV"

      # The secret is the key file's whole contents (it is all ASCII).
      - name: minisign secret key
        env:
          TREK_MINISIGN_KEY_FILE: ${{ secrets.TREK_MINISIGN_KEY }}
        run: |
          if [ -z "$TREK_MINISIGN_KEY_FILE" ]; then
            echo "::error::the TREK_MINISIGN_KEY secret is not set (docs/RELEASING.md)"
            exit 1
          fi
          key="$RUNNER_TEMP/minisign.key"
          printf '%s' "$TREK_MINISIGN_KEY_FILE" > "$key"
          chmod 600 "$key"
          echo "TREK_MINISIGN_KEY=$key" >> "$GITHUB_ENV"

      # --skip-tests: ci.yml runs the whole suite (Linux included) on every push.
      - name: Build, sign and package
        env:
          TREK_MINISIGN_PASSWORD: ${{ secrets.TREK_MINISIGN_PASSWORD }}
          TREK_VERSION: ${{ inputs.version }}
          TREK_CHANNEL: ${{ inputs.channel }}
        run: script/release-linux.sh "$TREK_VERSION" --channel "$TREK_CHANNEL" --build-only --skip-tests

      - name: Linux build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-build-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error

  # Only the manifest merge needs the macOS release to exist (release.ps1 -PublishOnly downloads
  # the <channel>.json release.sh wrote), so this is a short tail after both builds.
  publish:
    name: Windows publish
    needs: [macos, build]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # release.ps1 lives here; full history for the notes' `git log` fallback.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Windows build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-build
          path: dist/release

      # A dry run's stand-in for the release's <channel>.json, as the macOS job left it.
      - name: Manifest from the macOS dry run
        if: inputs.dry_run == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-manifest
          path: ${{ runner.temp }}/mac-manifest

      - name: Merge manifest and attach
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TREK_VERSION: ${{ inputs.version }}
          TREK_CHANNEL: ${{ inputs.channel }}
        run: >-
          ./script/release.ps1 $env:TREK_VERSION -Channel $env:TREK_CHANNEL
          -PublishOnly -Publish

      - name: Merge manifest (dry run)
        if: inputs.dry_run == true
        env:
          TREK_VERSION: ${{ inputs.version }}
          TREK_CHANNEL: ${{ inputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TREK_VERSION.TrimStart('v')
          $more = @{}
          $mac = "$env:RUNNER_TEMP\mac-manifest\$env:TREK_CHANNEL.json"
          if (Test-Path $mac) { $more.ExistingManifest = $mac }
          ./script/release.ps1 $env:TREK_VERSION -Channel $env:TREK_CHANNEL -PublishOnly @more
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = "dist\release\$version"
          $zip = Get-Item "$out\Trek-$version-windows-x86_64.zip"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content "$out\$env:TREK_CHANNEL.json" -Raw
          @(
            "### Windows (dry run: nothing uploaded)"
            ''
            "``$($zip.Name)`` sha256 ``$sha``"
            ''
            '```json'
            $manifest.TrimEnd()
            '```'
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

  # The Intel build joins the release last: after the Windows publish, however that ended, since two
  # merges of one manifest at once would lose one of them. Until it lands, Intel Macs see the new
  # version with no build for them yet and say it's on its way. Safe to re-run: it replaces its own
  # assets and its own entry.
  publish-intel:
    name: Intel publish
    needs: [macos, intel, publish]
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.intel.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # script/lib/merge-manifest.py.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Intel build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: intel-build
          path: dist/release

      # A dry run's stand-in for the release's <channel>.json, as the macOS job left it.
      - name: Manifest from the macOS dry run
        if: inputs.dry_run == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-manifest
          path: ${{ runner.temp }}/mac-manifest

      - name: Merge manifest (dry run)
        if: inputs.dry_run == true
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          out="dist/release/${VERSION#v}"
          merged=$(python3 script/lib/merge-manifest.py "$RUNNER_TEMP/mac-manifest/$CHANNEL.json" "$out/$CHANNEL.json")
          {
            echo "### Manifest with the Intel build (dry run: nothing uploaded)"
            echo
            echo '```json'
            echo "$merged"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge manifest and attach
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          version=${VERSION#v}
          out="dist/release/$version"
          tag=$CHANNEL
          [[ $CHANNEL == stable ]] && tag="v$version"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$CHANNEL.json" --output "$RUNNER_TEMP/release.json" --clobber
          python3 script/lib/merge-manifest.py "$RUNNER_TEMP/release.json" "$out/$CHANNEL.json" > "$RUNNER_TEMP/$CHANNEL.json"
          # The archive first, the manifest that points at it last.
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$out/Trek-$version-darwin-x86_64.app.tar.gz" "$out/Trek-$version-darwin-x86_64.app.tar.gz.minisig" "$out/Trek-$version-darwin-x86_64.dmg"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/$CHANNEL.json"

  # Linux joins the release last, after the Intel build however that ended: two merges of one
  # manifest at once would lose one of them. Both architectures' downloads and entries in one go.
  # Safe to re-run: it replaces its own assets and its own entries.
  publish-linux:
    name: Linux publish
    needs: [macos, linux, publish-intel]
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # script/release-linux.sh and script/lib/merge-manifest.py.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Linux build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-build-*
          path: dist/release
          merge-multiple: true

      # A dry run's stand-in for the release's <channel>.json, as the macOS job left it.
      - name: Manifest from the macOS dry run
        if: inputs.dry_run == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-manifest
          path: ${{ runner.temp }}/mac-manifest

      - name: Merge manifest (dry run)
        if: inputs.dry_run == true
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          mac="$RUNNER_TEMP/mac-manifest/$CHANNEL.json"
          more=()
          [[ -f $mac ]] && more=(--existing-manifest "$mac")
          script/release-linux.sh "$VERSION" --channel "$CHANNEL" --publish-only "${more[@]}"
          {
            echo "### Manifest with the Linux builds (dry run: nothing uploaded)"
            echo
            echo '```json'
            cat "dist/release/${VERSION#v}/$CHANNEL.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge manifest and attach
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: script/release-linux.sh "$VERSION" --channel "$CHANNEL" --publish-only --publish

  # Every platform's downloads are on the release, and in its manifest: v0.4.6, v0.4.9 and v0.4.10
  # went out without their Windows ones. Run whatever became of the publish jobs, so a release left
  # without a platform says which, in red, rather than looking whole.
  complete:
    name: Every platform released
    needs: [publish, publish-intel, publish-linux]
    if: ${{ !cancelled() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Downloads and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          tag=$CHANNEL
          [[ $CHANNEL == stable ]] && tag="v$version"
          resume="gh run rerun $GITHUB_RUN_ID --failed"
          if ! assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            echo "::error::there's no release $tag: the macOS job didn't publish it. Its summary says what it left; re-running the failed jobs carries on from there: $resume"
            exit 1
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$CHANNEL.json" --output "$RUNNER_TEMP/release.json" --clobber
          missing=()
          wanted=(
            "Trek-$version-darwin-aarch64.app.tar.gz" "Trek-$version-darwin-aarch64.app.tar.gz.minisig" "Trek-$version-darwin-aarch64.dmg"
            "Trek-$version-darwin-x86_64.app.tar.gz" "Trek-$version-darwin-x86_64.app.tar.gz.minisig" "Trek-$version-darwin-x86_64.dmg"
            "Trek-$version-windows-x86_64.zip" "Trek-$version-windows-x86_64.zip.minisig" "Trek-Setup-x86_64.exe"
          )
          # Debian orders 0.4.1~beta.2 before 0.4.1: the .deb's version (script/bundle-linux.sh).
          deb=${version/-/\~}
          for arch in x86_64 aarch64; do
            debarch=amd64; [[ $arch == aarch64 ]] && debarch=arm64
            wanted+=("Trek-$version-linux-$arch.AppImage" "Trek-$version-linux-$arch.AppImage.minisig" "Trek-$version-linux-$arch.tar.gz" "trek_${deb}_$debarch.deb")
          done
          for want in "${wanted[@]}"; do
            grep -qxF "$want" <<< "$assets" || missing+=("$want")
          done
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64 linux-aarch64; do
            jq -e --arg p "$platform" --arg v "$version" '.version == $v and (.platforms[$p] != null)' "$RUNNER_TEMP/release.json" > /dev/null ||
              missing+=("$platform in $CHANNEL.json")
          done
          if (( ${#missing[@]} )); then
            for m in "${missing[@]}"; do
              echo "::error::$tag is missing $m"
            done
            # The publish jobs add or replace only their own platform's files and entry.
            echo "Re-run the failed jobs to finish $tag: \`$resume\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$tag has every platform's downloads and manifest entry."
