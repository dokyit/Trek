name: Rust job setup
description: >-
  What every Rust job of ci.yml starts with: the pinned toolchain, its build cache restored and
  made fresh (script/ci-cache.py), and optionally cargo-nextest and the Metal compiler. The job's
  own steps come after; its cache is saved by ./.github/actions/rust-cache-save.
inputs:
  kind:
    description: The cache's kind (script/ci-cache.py key KIND); one per kind of job, as each builds its own feature set.
    required: true
  components:
    description: rustup components (clippy, rustfmt)
    default: ''
  targets:
    description: rustup targets
    default: ''
  nextest:
    description: Install cargo-nextest
    default: 'false'
  metal:
    description: Make sure the Metal compiler is there (macOS; gpui compiles its shaders at build time)
    default: 'false'
outputs:
  cache-hit:
    description: The cache's exact key was found
    value: ${{ steps.cache.outputs.cache-hit }}
  key:
    description: The cache's key
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, November 2026
      with:
        toolchain: '1.99.0'
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache key
      id: key
      shell: bash
      run: $(command -v python3 || command -v python) script/ci-cache.py key "${{ inputs.kind }}"

    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: cache
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.restore }}

    # Unchanged files dated before the cached artifacts, the registry's sources unpacked and dated
    # too: what didn't change isn't compiled again (script/ci-cache.py, "restore").
    - name: Cache freshness
      shell: bash
      run: $(command -v python3 || command -v python) script/ci-cache.py restore

    # cargo-nextest: each test in a process of its own, the binaries' tests run side by side
    # (.config/nextest.toml). A pinned release's prebuilt binary from its GitHub release, checked
    # against the release's SHA-256, with timeouts: a download through get.nexte.st once hung a
    # macOS job for its whole hour.
    - name: cargo-nextest
      if: inputs.nextest == 'true'
      shell: bash
      run: |
        version=0.9.151
        case "$RUNNER_OS-$RUNNER_ARCH" in
          macOS-*) asset=universal-apple-darwin; sum=d1d7d025d4bfc9fb154cd76aea3949bd78534829a0589abefa6e5dd4edb135dd ;;
          Linux-ARM64) asset=aarch64-unknown-linux-gnu; sum=3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd ;;
          Linux-*) asset=x86_64-unknown-linux-gnu; sum=1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4 ;;
          Windows-*) asset=x86_64-pc-windows-msvc; sum=e51bdb4b5883df48f335381b287378edb244318fac65ae0adaf6b9e69298246b ;;
        esac
        url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-$asset.tar.gz"
        curl -fLsS --connect-timeout 20 --max-time 120 --retry 5 --retry-all-errors -o "$RUNNER_TEMP/nextest.tar.gz" "$url"
        # From stdin: given a path with backslashes, Git Bash's sha256sum prefixes the hash with one.
        if command -v sha256sum > /dev/null; then got=$(sha256sum < "$RUNNER_TEMP/nextest.tar.gz"); else got=$(shasum -a 256 < "$RUNNER_TEMP/nextest.tar.gz"); fi
        got=${got%% *}
        [ "$got" = "$sum" ] || { echo "::error::cargo-nextest $version $asset: SHA-256 $got, not $sum"; exit 1; }
        # A folder of its own on PATH (some macOS images have no ~/.cargo/bin; cargo finds
        # `cargo-nextest` on PATH).
        bin="$RUNNER_TEMP/nextest-bin"
        archive="$RUNNER_TEMP/nextest.tar.gz"
        mkdir -p "$bin"
        echo "$bin" >> "$GITHUB_PATH"
        # Git Bash's tar takes C:\… (or D:\…) for a remote host named C: give it /c/….
        if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -u "$bin"); archive=$(cygpath -u "$archive"); fi
        tar zxf "$archive" -C "$bin"
        "$bin/cargo-nextest" nextest --version

    # gpui compiles its Metal shaders at build time with `xcrun metal`. Since Xcode 26 the Metal
    # toolchain is a separate component that an image may not have; `xcrun -f metal` finds a stub
    # either way, so run the compiler to tell.
    - name: Metal toolchain
      if: inputs.metal == 'true'
      shell: bash
      run: |
        xcodebuild -version
        if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
          xcodebuild -downloadComponent MetalToolchain
        fi
        xcrun -sdk macosx metal --version
